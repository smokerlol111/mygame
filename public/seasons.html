<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сезони — SMOKERLOL</title><link rel="stylesheet" href="/style.css?v=158"><style>.seasonTabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.seasonTab.active{outline:2px solid var(--accent2)}.lb{width:100%;border-collapse:collapse}.lb th,.lb td{padding:12px 10px;border-bottom:1px solid #40345e;text-align:left}.place{font-size:22px;font-weight:900}.gameHistory{display:grid;gap:12px}.historyCard{background:#151024;border:1px solid #40345e;border-radius:14px;padding:14px}.historyResults{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.historyResults span{background:#241a3c;border-radius:10px;padding:7px 10px}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">SMOKERLOL</div><h1>🏆 СЕЗОНИ ТА РЕЗУЛЬТАТИ</h1></div><a class="btn secondary" href="/">← Головна</a></div><div id="app" class="panel">Завантаження…</div></div><script>
const app=document.getElementById('app');let payload,current='';const pointsWord=n=>{n=Math.abs(Number(n)||0)%100;const n10=n%10;if(n>10&&n<20)return 'балів';if(n10===1)return 'бал';if(n10>=2&&n10<=4)return 'бали';return 'балів'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/seasons',{cache:'no-store'});payload=await r.json();if(!r.ok)throw Error();const a=payload.seasons.find(s=>s.status==='active')||payload.seasons[0];current=current||a?.id||'';render()}catch(e){app.innerHTML='<h2>Не вдалося завантажити статистику</h2>'}}
function render(){const ss=payload.seasons||[],s=ss.find(x=>x.id===current)||ss[0];if(!s){app.innerHTML='<h2>Сезонів ще немає</h2>';return}const medals=['🥇','🥈','🥉'];
const tabs=ss.map(x=>`<button class="btn secondary seasonTab ${x.id===s.id?'active':''}" data-id="${x.id}">${x.status==='active'?'🟢':'📚'} ${esc(x.name)}</button>`).join('');
const rows=s.leaderboard.map((p,i)=>`<tr><td class="place">${medals[i]||i+1}</td><td><b>${esc(p.name)}</b></td><td>${p.games}</td><td>${p.wins}</td><td>${p.podiums}</td><td><b>${p.seasonPoints}</b></td><td>${p.totalGameScore}</td></tr>`).join('');
const games=s.games.map(g=>`<div class="historyCard"><b>${g.isGrandFinal?'👑 GRAND FINAL • ':''}${esc(g.title)}</b> <span class="muted">• ${new Date(g.playedAt).toLocaleString('uk-UA')}</span><div class="historyResults">${(g.results||[]).map(r=>`<span>${r.place}. ${esc(r.name)} — <b>${r.score}</b> (${r.seasonPoints} ${pointsWord(r.seasonPoints)})</span>`).join('')}</div></div>`).join('');
app.innerHTML=`<div class="seasonTabs">${tabs}</div><div class="center"><div class="badge">${s.status==='completed'?'📚 АРХІВ':'🟢 АКТИВНИЙ СЕЗОН'}</div><h2>${esc(s.name)}</h2>${s.champion?`<div class="panel" style="display:inline-block;padding:18px 28px;margin:8px auto 18px"><div class="huge">🏆 ${esc(s.champion.name)}</div><p class="muted" style="margin-bottom:0">Чемпіон сезону • ${s.champion.seasonPoints} ${pointsWord(s.champion.seasonPoints)}</p></div>`:''}<p class="muted">${s.games.length} збережених ігор</p></div><h2>Таблиця сезону</h2><div style="overflow:auto"><table class="lb"><thead><tr><th>#</th><th>Гравець</th><th>Ігри</th><th>Перемоги</th><th>Подіуми</th><th>Сезонні</th><th>Ігрові</th></tr></thead><tbody>${rows||'<tr><td colspan="7">Ще немає збережених ігор.</td></tr>'}</tbody></table></div><h2 style="margin-top:28px">Історія ігор</h2><div class="gameHistory">${games||'<p class="muted">Ігор ще немає.</p>'}</div>`;document.querySelectorAll('.seasonTab').forEach(b=>b.onclick=()=>{current=b.dataset.id;render()})}load();
</script></body></html>
