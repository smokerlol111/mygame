<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ведучий — Своя гра</title><link rel="stylesheet" href="/style.css?v=158"><script src="/socket.io/socket.io.js"></script><script src="/common.js?v=158"></script><style>
.menuHero{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.gameMenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gameCard{appearance:none;text-align:left;border:1px solid #493b70;background:#171128;color:white;border-radius:18px;padding:20px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.gameCard:hover{outline:2px solid var(--accent2)}
.gameIcon{font-size:40px}.gameCard h2{margin:0 0 6px}.gameCard p{margin:0}.gamePlay{font-weight:900;color:#d7c8ff}
</style></head><body><div id="netBadge" style="position:fixed;right:14px;bottom:14px;z-index:9999;padding:8px 12px;border-radius:999px;background:#201833;border:1px solid #4d3d73;font-weight:800">🟡 Підключення…</div><div class="wrap"><div class="top"><div><div class="brand">SMOKERLOL • HOST</div><h1>СВОЯ ГРА — КІНОХАРДКОР</h1></div><div id="roomBox"></div></div><div id="app" class="panel"><button id="create" class="btn">Створити онлайн-кімнату</button></div></div><script>
const socket=io(); let state=null,data=null,gamesList=[],seasonAdminToken='',selectedGameId='',hostSpecialCells={},code='',hostToken=localStorage.getItem('sgHostToken')||'',storedCode=localStorage.getItem('sgRoomCode')||'';
function setNetBadge(ok){
 const el=document.getElementById('netBadge');if(!el)return;
 el.textContent=ok?'🟢 Сервер підключено':'🔴 З’єднання втрачено';
}
function restoreHostConnection(){
 if(!code||!hostToken)return;
 socket.emit('rejoinHost',{code,hostToken},async r=>{
   if(!r?.ok)return;
   state=r.state;selectedGameId=r.gameId||state.gameId;hostSpecialCells=r.specialCells||{};
   try{if(!data||selectedGameId!==state.gameId)await loadGameData(selectedGameId)}catch(e){console.error(e)}
   renderRoom();if(data)render();
 });
}
socket.on('connect',()=>{setNetBadge(true);if(code&&hostToken)restoreHostConnection()});
socket.on('disconnect',()=>setNetBadge(false));


let firstTurnClockHandle=null;
function armFirstTurnClock(){
  if(firstTurnClockHandle){clearInterval(firstTurnClockHandle);firstTurnClockHandle=null}
  const el=document.getElementById('firstTurnTimer');
  const end=Number(state?.firstTurnQuiz?.endsAt||0);
  if(!el||!end||state?.firstTurnQuiz?.timerStatus!=='running')return;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    el.textContent=String(left);
    if(left<=0&&firstTurnClockHandle){clearInterval(firstTurnClockHandle);firstTurnClockHandle=null}
  };
  tick();
  firstTurnClockHandle=setInterval(tick,200);
}

async function loadGameData(gameId){
 const r=await fetch(`/games/${encodeURIComponent(gameId)}.json`,{cache:'no-store'});
 if(!r.ok) throw new Error('Game HTTP '+r.status);
 data=await r.json();
}
async function init(){
 try{
  const gr=await fetch('/games',{cache:'no-store'});
  if(!gr.ok) throw new Error('Games HTTP '+gr.status);
  gamesList=await gr.json();
  if(storedCode&&hostToken){
   socket.emit('rejoinHost',{code:storedCode,hostToken},async r=>{
    if(r.ok){
      code=r.code; state=r.state; selectedGameId=r.gameId||state.gameId; hostSpecialCells=r.specialCells||{};
      await loadGameData(selectedGameId); renderRoom(); render();
    } else {
      localStorage.removeItem('sgHostToken'); localStorage.removeItem('sgRoomCode');
      hostToken=''; storedCode=''; renderStart();
    }
   });
  } else renderStart();
 }catch(e){
  roomBox.innerHTML='';
  app.innerHTML='<h2>Помилка завантаження меню</h2><p class="muted">Не вдалося завантажити список ігор. Оновіть сторінку.</p>';
  console.error(e);
 }
}
init();
const app=document.getElementById('app'), roomBox=document.getElementById('roomBox');
function renderStart(){
 roomBox.innerHTML='';
 const cards=gamesList.map(g=>`<button class="gameCard" data-game="${GameUI.esc(g.id)}"><div class="gameIcon">${GameUI.esc(g.icon||'🎮')}</div><div><h2>${GameUI.esc(g.title)}</h2><p class="muted">${GameUI.esc(g.description||'')}</p></div><div class="gamePlay">Грати →</div></button>`).join('');
 app.innerHTML=`<div class="menuHero"><div><h2>🎮 Оберіть гру</h2><p class="muted">Створіть кімнату з потрібним набором категорій і запитань.</p></div></div>
 <div class="gameMenu">${cards||'<p>Немає доступних ігор.</p>'}</div>
 <div class="panel" style="margin-top:22px"><h2 style="margin-top:0">🏆 Керування сезонами</h2><div id="startSeasonAdmin"><p class="muted">Завантаження сезонів…</p></div></div>
 <div class="row" style="margin-top:20px"><a class="btn gold" href="/seasons" target="_blank">🏆 Публічні сезони та результати</a></div>`;
 document.querySelectorAll('.gameCard').forEach(b=>b.onclick=()=>createRoom(b.dataset.game));
 loadStartSeasonAdmin();
}

function seasonPointsWordStart(n){n=Math.abs(Number(n)||0)%100;const n10=n%10;if(n>10&&n<20)return 'балів';if(n10===1)return 'бал';if(n10>=2&&n10<=4)return 'бали';return 'балів'}
function loadStartSeasonAdmin(){
 const area=document.getElementById('startSeasonAdmin');if(!area)return;
 socket.emit('seasonAdminInit',{},r=>{
   if(!r?.ok){area.innerHTML=`<p>${GameUI.esc(r?.error||'Помилка')}</p>`;return}
   seasonAdminToken=r.adminToken||seasonAdminToken;
   fetch('/api/seasons',{cache:'no-store'}).then(x=>x.json()).then(payload=>{
     const detailed=payload.seasons||[],active=detailed.find(s=>s.status==='active'),completed=detailed.filter(s=>s.status==='completed');
     const activeHtml=active?`<div style="padding:14px;border:1px solid #6e53a8;border-radius:14px"><div class="top"><div><h3 style="margin:0">🟢 ${GameUI.esc(active.name)}</h3><div class="muted">${active.games.length} ігор • ${active.leaderboard.length} гравців</div></div><button class="btn bad startFinishSeason" data-id="${active.id}" data-name="${GameUI.esc(active.name)}">🏁 Завершити сезон</button></div>${active.leaderboard.length?`<div class="muted" style="margin-top:10px">Лідер: <b>${GameUI.esc(active.leaderboard[0].name)}</b> — ${active.leaderboard[0].seasonPoints} ${seasonPointsWordStart(active.leaderboard[0].seasonPoints)}</div>`:''}</div>`:`<div class="center"><h3>Немає активного сезону</h3><p class="muted">Створіть наступний сезон для нових ігор.</p></div>`;
     const archiveHtml=completed.length?`<div style="margin-top:16px"><h3>📚 Архів сезонів</h3>${completed.map(s=>`<div class="finalItem"><span><b>${GameUI.esc(s.name)}</b>${s.champion?` • 🏆 ${GameUI.esc(s.champion.name)}`:''}<div class="muted">${s.games.length} ігор</div></span><button class="btn secondary startReopenSeason" data-id="${s.id}">↩ Відновити</button></div>`).join('')}</div>`:'';
     const createHtml=!active?`<div class="row" style="margin-top:16px"><input id="startNewSeasonName" value="Сезон ${detailed.length+1}" style="max-width:260px"><button class="btn gold" id="startCreateSeason">➕ Створити наступний сезон</button></div>`:'';
     area.innerHTML=activeHtml+createHtml+archiveHtml;
     area.querySelectorAll('.startFinishSeason').forEach(b=>b.onclick=()=>{if(!confirm(`Завершити «${b.dataset.name}»? Сезон перейде в архів, а лідер стане чемпіоном.`))return;socket.emit('seasonAdminSetStatus',{adminToken:seasonAdminToken,seasonId:b.dataset.id,status:'completed'},x=>{if(!x?.ok)alert(x?.error||'Помилка');else loadStartSeasonAdmin()})});
     area.querySelectorAll('.startReopenSeason').forEach(b=>b.onclick=()=>{if(!confirm('Відновити цей сезон як активний?'))return;socket.emit('seasonAdminSetStatus',{adminToken:seasonAdminToken,seasonId:b.dataset.id,status:'active'},x=>{if(!x?.ok)alert(x?.error||'Помилка');else loadStartSeasonAdmin()})});
     const create=document.getElementById('startCreateSeason');if(create)create.onclick=()=>{const name=document.getElementById('startNewSeasonName').value.trim();if(!name)return alert('Вкажіть назву сезону.');socket.emit('seasonAdminCreate',{adminToken:seasonAdminToken,name},x=>{if(!x?.ok)alert(x?.error||'Помилка');else loadStartSeasonAdmin()})};
   }).catch(()=>{area.innerHTML='<p>Не вдалося завантажити деталі сезонів.</p>'});
 });
}

async function createRoom(gameId){
 selectedGameId=gameId;
 await loadGameData(gameId);
 socket.emit('createRoom',{hostToken:crypto.randomUUID(),gameId},r=>{
   if(!r.ok){alert(r.error||'Не вдалося створити кімнату');return}
   code=r.code;hostToken=r.hostToken;state=r.state||state;hostSpecialCells=r.specialCells||{};
   localStorage.setItem('sgHostToken',hostToken);localStorage.setItem('sgRoomCode',code);
   renderRoom();render();
 });
}
function renderRoom(){roomBox.innerHTML=`<div class="badge">Кімната <b>${code}</b></div>`}
socket.on('state',async s=>{if(code&&s.code!==code)return;state=s;code=s.code;if(s.gameId&&s.gameId!==selectedGameId){selectedGameId=s.gameId;await loadGameData(selectedGameId)}renderRoom();if(data)render()});
socket.on('hostSecrets',s=>{if(code&&s.code!==code)return;hostSpecialCells=s.specialCells||{};if(data&&state)render()});
socket.on('firstTurnProgress',x=>{if(!state||x.code!==code||state.phase!=='first_turn_quiz')return;state.firstTurnQuiz.submittedPlayerIds=x.submittedPlayerIds||[];render()});
socket.on('roomClosed',x=>{if(x.code!==code)return;localStorage.removeItem('sgHostToken');localStorage.removeItem('sgRoomCode');code='';hostToken='';state=null;data=null;selectedGameId='';hostSpecialCells={};renderStart()});
function emit(ev,p={},cb=()=>{}){socket.emit(ev,{code,...p},cb)}
function hostBoardHTML(){
 const r=data.rounds[state.round]; let h='<div class="grid">';
 r.categories.forEach(c=>h+=`<div class="cat">${GameUI.esc(c.name)}</div>`);
 for(let qi=0;qi<5;qi++){
  r.categories.forEach((c,ci)=>{
   const q=c.questions[qi], key=`${state.round}:${ci}:${qi}`, used=state.used[key];
   const special=hostSpecialCells[key];
   const mark=q.cat?'🐈':special==='va_bank'?'🎰':special==='duel'?'⚔️':'';
   const title=q.cat?'Кіт у мішку':special==='va_bank'?'ВА-БАНК':special==='duel'?'ДУЕЛЬ':'';
   h+=`<button class="tile ${used?'used':''}" data-ci="${ci}" data-qi="${qi}" ${used?'disabled':''} title="${title}"><span>${q.value}</span>${mark?` <span style="font-size:.55em;vertical-align:middle">${mark}</span>`:''}</button>`;
  });
 }
 return h+'</div>';
}

function seasonSaveHTML(){if(state?.phase!=='final_result')return '';return `<div class="panel" style="margin-top:20px;border:1px solid #8d70d8"><h2>🏆 Зберегти результат у сезон</h2>${state.savedSeasonGameId?`<p><b>✅ Результат уже збережено.</b></p><a class="btn gold" href="/seasons" target="_blank">Відкрити таблицю сезону</a>`:`<div id="seasonSaveArea"><p class="muted">Завантажуємо список сезонів…</p></div>`}</div>`}
function loadSeasonSaveArea(){const area=document.getElementById('seasonSaveArea');if(!area)return;emit('seasonListHost',{},r=>{if(!r?.ok){area.innerHTML=`<p>${GameUI.esc(r?.error||'Помилка')}</p>`;return}const active=(r.seasons||[]).filter(s=>s.status==='active');area.innerHTML=active.length?`<div class="row"><select id="seasonSelect" style="min-width:220px">${active.map(s=>`<option value="${s.id}">${GameUI.esc(s.name)}</option>`).join('')}</select><label style="display:flex;gap:8px;align-items:center"><input id="grandFinal" type="checkbox" style="width:auto"> 👑 Grand Final</label><button class="btn gold" id="saveSeasonResult">💾 Зберегти результат у сезон</button></div>`:`<p class="muted">Немає активного сезону. Створіть його в блоці «🏆 Керування сезонами» нижче.</p>`;const save=document.getElementById('saveSeasonResult');if(save)save.onclick=()=>emit('saveSeasonResult',{seasonId:document.getElementById('seasonSelect').value,isGrandFinal:document.getElementById('grandFinal').checked},x=>{if(!x?.ok)alert(x?.error||'Помилка');else alert('Результат збережено в сезон!')})})}

function seasonPointsWord(n){n=Math.abs(Number(n)||0)%100;const n10=n%10;if(n>10&&n<20)return 'балів';if(n10===1)return 'бал';if(n10>=2&&n10<=4)return 'бали';return 'балів'}
function seasonManagerHTML(){
 if(!state)return '';
 return `<details class="panel" style="margin-top:20px"><summary style="cursor:pointer;font-size:20px;font-weight:800">🏆 Керування сезонами</summary><div id="seasonManagerArea" style="margin-top:14px"><p class="muted">Завантаження сезонів…</p></div></details>`;
}
async function loadSeasonManagerArea(){
 const area=document.getElementById('seasonManagerArea');if(!area)return;
 try{
   const r=await fetch('/api/seasons',{cache:'no-store'}),payload=await r.json();
   if(!r.ok)throw Error(payload.error||'Не вдалося завантажити сезони.');
   const seasons=payload.seasons||[],active=seasons.find(s=>s.status==='active');
   const activeHtml=active?`<div style="padding:14px;border:1px solid #6e53a8;border-radius:14px"><div class="top"><div><h3 style="margin:0">🟢 ${GameUI.esc(active.name)}</h3><div class="muted">${active.games.length} ігор • ${active.leaderboard.length} гравців</div></div><button class="btn bad finishSeason" data-id="${active.id}" data-name="${GameUI.esc(active.name)}">🏁 Завершити сезон</button></div>${active.leaderboard.length?`<div class="muted" style="margin-top:10px">Лідер зараз: <b>${GameUI.esc(active.leaderboard[0].name)}</b> — ${active.leaderboard[0].seasonPoints} ${seasonPointsWord(active.leaderboard[0].seasonPoints)}</div>`:''}</div>`:`<div class="center"><h3>Немає активного сезону</h3><p class="muted">Створіть наступний сезон для нових ігор.</p></div>`;
   const completed=seasons.filter(s=>s.status==='completed');
   const archiveHtml=completed.length?`<div style="margin-top:16px"><h3>📚 Архів сезонів</h3>${completed.map(s=>`<div class="finalItem"><span><b>${GameUI.esc(s.name)}</b>${s.champion?` • 🏆 ${GameUI.esc(s.champion.name)}`:''}<div class="muted">${s.games.length} ігор</div></span><button class="btn secondary reopenSeason" data-id="${s.id}">↩ Відновити</button></div>`).join('')}</div>`:'';
   const createHtml=!active?`<div class="row" style="margin-top:16px"><input id="managerNewSeasonName" value="Сезон ${seasons.length+1}" style="max-width:260px"><button class="btn gold" id="managerCreateSeason">➕ Створити наступний сезон</button></div>`:'';
   area.innerHTML=activeHtml+createHtml+archiveHtml+`<div class="row" style="margin-top:16px"><a class="btn secondary" href="/seasons" target="_blank">Відкрити публічну таблицю →</a></div>`;
   area.querySelectorAll('.finishSeason').forEach(b=>b.onclick=()=>{if(!confirm(`Завершити «${b.dataset.name}»? Сезон перейде в архів, а переможець стане чемпіоном.`))return;emit('setSeasonStatus',{seasonId:b.dataset.id,status:'completed'},x=>{if(!x?.ok)alert(x?.error||'Помилка');else{loadSeasonManagerArea();loadSeasonSaveArea()}})});
   area.querySelectorAll('.reopenSeason').forEach(b=>b.onclick=()=>{if(!confirm('Відновити цей сезон як активний?'))return;emit('setSeasonStatus',{seasonId:b.dataset.id,status:'active'},x=>{if(!x?.ok)alert(x?.error||'Помилка');else{loadSeasonManagerArea();loadSeasonSaveArea()}})});
   const create=document.getElementById('managerCreateSeason');if(create)create.onclick=()=>{const name=document.getElementById('managerNewSeasonName').value.trim();if(!name)return alert('Вкажіть назву сезону.');emit('createSeason',{name},x=>{if(!x?.ok)alert(x?.error||'Помилка');else{loadSeasonManagerArea();loadSeasonSaveArea()}})};
 }catch(e){area.innerHTML=`<p>${GameUI.esc(e.message||'Помилка')}</p>`}
}

function hostControlsHTML(){
 if(!state)return '';
 const rows=(state.players||[]).map(p=>`
   <div style="display:grid;grid-template-columns:minmax(130px,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)">
     <div><b>${GameUI.esc(p.name)}</b><div class="muted">Рахунок: ${p.score}</div></div>
     <div class="row" style="gap:6px;flex-wrap:nowrap">
       <button class="btn secondary scoreQuick" data-id="${p.id}" data-v="-500" style="padding:8px 10px">−500</button>
       <button class="btn secondary scoreQuick" data-id="${p.id}" data-v="-100" style="padding:8px 10px">−100</button>
       <button class="btn scoreQuick" data-id="${p.id}" data-v="100" style="padding:8px 10px">+100</button>
       <button class="btn scoreQuick" data-id="${p.id}" data-v="500" style="padding:8px 10px">+500</button>
     </div>
     <div class="row" style="gap:6px;flex-wrap:nowrap">
       <input class="scoreCustomInput" data-id="${p.id}" type="number" step="1" placeholder="+250 / -250" style="width:125px;margin:0">
       <button class="btn gold scoreCustom" data-id="${p.id}" style="padding:8px 12px">Застосувати</button>
     </div>
   </div>`).join('');
 return `<details class="panel" style="margin-top:24px">
   <summary style="cursor:pointer;font-size:20px;font-weight:800">⚙️ Керування ведучого</summary>
   <div style="margin-top:14px">
     <h3 style="margin-bottom:4px">Ручне коригування балів</h3>
     <p class="muted" style="margin-top:0">Можна дати бонус або штраф незалежно від питань. Зміна одразу з'явиться в OBS і на телефонах.</p>
     ${rows || '<p class="muted">Гравців ще немає.</p>'}
     <div style="margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)">
       <h3 style="margin:0 0 6px">🚨 Аварійне керування</h3>
       <p class="muted" style="margin-top:0">Використовуй лише якщо під час ефіру завис логічний етап.</p>
       <div class="row">
         <button class="btn gold" id="pauseGame">${state.paused?'▶ ПРОДОВЖИТИ':'⏸ ПАУЗА'}</button>
         <button class="btn secondary" id="emergencyBuzz">🔔 Повернути BUZZ</button>
         <button class="btn secondary" id="emergencyReveal">👁 Відкрити відповідь</button>
         <button class="btn secondary" id="emergencyBoard">⏭ Закрити питання → дошка</button>
       </div>
     </div>
     <div style="margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)">
       <button class="btn bad" id="stopGame">⛔ ЗАВЕРШИТИ ГРУ</button>
       <span class="muted" style="margin-left:10px">Закриє кімнату для всіх гравців та OBS.</span>
     </div>
   </div>
 </details>`;
}

function render(){if(!state||!data)return;let h='';
 if(state.phase==='paused'){
   h=`<div class="center"><div class="huge">⏸</div><h1>ТЕХНІЧНА ПАУЗА</h1><p class="muted">Гра зупинена. Таймери та дії гравців заблоковано.</p><p>Попередній етап: <b>${GameUI.esc(state.pausedPhase||'—')}</b></p></div>`;
 }
 else
 if(state.phase==='lobby'){h=`<h2>Лобі</h2><div class="roomCode">${state.code}</div><p>Гравці відкривають <b>${location.origin}/play?room=${state.code}</b></p><p>OBS: <b>${location.origin}/screen/${state.code}</b></p>${GameUI.playersHTML(state.players)}<div class="row"><button class="btn" id="start">🎯 Почати розіграш першого ходу</button><button class="btn secondary" id="skipFirst">Пропустити розіграш</button><button class="btn secondary" id="newRoom">Нова кімната</button></div>`}
 else if(state.phase==='first_turn_quiz'){
   const q=state.firstTurnQuiz||{}, submitted=q.submittedPlayerIds||[], status=q.timerStatus||'ready';
   const allDone=submitted.length===state.players.length;
   const canReveal=allDone||status==='expired';
   const timerBlock=status==='running'
     ? `<div class="huge"><span id="firstTurnTimer">30</span></div><div class="muted">секунд</div>`
     : status==='expired'
       ? `<div class="huge">0</div><div class="muted">⏱ Час вийшов</div>`
       : `<div class="huge">30</div><div class="muted">Таймер ще не запущено</div>`;
   h=`<div class="center"><div class="huge">🎯</div><h1>РОЗІГРАШ ПЕРШОГО ХОДУ</h1><div class="question">${GameUI.esc(q.question||'')}</div>${timerBlock}<p class="muted">Відповіді гравців приховані до відкриття.</p></div><div class="finalList">${state.players.map(p=>`<div class="finalItem"><span>${GameUI.esc(p.name)}</span><b>${submitted.includes(p.id)?'✅ відповідь є':status==='expired'?'❌ немає відповіді':'⏳ чекаємо'}</b></div>`).join('')}</div><div class="row" style="justify-content:center">${status==='ready'?'<button class="btn gold" id="startFirstTimer">▶ Запустити 30 секунд</button>':''}<button class="btn gold" id="revealFirst" ${canReveal?'':'disabled'}>👁 Відкрити результати</button><button class="btn secondary" id="skipFirst">Пропустити</button></div>`}
 else if(state.phase==='first_turn_result'){
   const q=state.firstTurnQuiz, results=q.results||[], revealed=q.revealCount||0, total=results.length;
   const nextIndex=total-1-revealed;
   const nextLabel=revealed>=total?'Усі місця відкриті':revealed===total-1?'🥇 Показати переможця':`Показати ${nextIndex+1} місце`;
   h=`<div class="center"><div class="huge">🎯 ${q.correctAnswer}</div><h2>Правильна відповідь</h2><p class="muted">${GameUI.esc(q.unit||'')}</p></div>
   <div class="finalList">${results.map((r,i)=>`<div class="finalItem"><span><b>${i+1}. ${GameUI.esc(r.name)}</b></span><span>${r.noAnswer?'— немає відповіді':`Відповідь: <b>${r.answer}</b> • різниця: <b>${r.diff}</b>`}</span></div>`).join('')}</div>
   <div class="center muted" style="margin:14px 0">OBS відкрито: <b>${revealed}/${total}</b></div>
   <div class="row" style="justify-content:center">
     <button class="btn gold" id="revealNextFirst" ${revealed>=total?'disabled':''}>${nextLabel}</button>
     <button class="btn" id="beginRoundOne" ${revealed<total?'disabled':''}>▶ ПОЧАТИ 1 РАУНД</button>
   </div>`}
 else if(state.phase==='board'){let chooser=state.players.find(p=>p.id===state.turnPlayerId);h=`<div class="top"><div><h2>${data.rounds[state.round].name}</h2><div class="muted">🎯 Питання обирає: <b>${GameUI.esc(chooser?.name||'—')}</b></div></div><div class="row">${state.round===0?'<button class="btn secondary" id="nextRound">Раунд 2</button>':'<button class="btn gold" id="finalBets">Фінал</button>'}</div></div>${state.round===1?'<div class="muted center" style="margin:8px 0 12px">Службові позначки ведучого: 🐈 Кіт у мішку • 🎰 ВА-БАНК • ⚔️ Дуель</div>':''}${hostBoardHTML()}${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='va_bank_bet'){let p=state.players.find(x=>x.id===state.vaBankPlayer);h=`<div class="center"><div class="huge">🎰</div><h1>ВА-БАНК!</h1><p class="muted">Ставку на телефоні робить <b>${GameUI.esc(p?.name||'гравець')}</b>.</p></div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='va_bank_question'){let p=state.players.find(x=>x.id===state.vaBankPlayer);h=`<div class="center"><div class="huge">🎰 ВА-БАНК • ${state.vaBankBet}</div></div><div class="question">${GameUI.esc(state.current.q)}</div><p class="center muted">Відповідає тільки ${GameUI.esc(p?.name||'гравець')}</p><div class="row" style="justify-content:center"><button class="btn good" id="vbCorrect">Правильно +${state.vaBankBet}</button><button class="btn bad" id="vbWrong">Неправильно −${state.vaBankBet}</button></div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='duel_choose'){let p=state.players.find(x=>x.id===state.turnPlayerId);h=`<div class="center"><div class="huge">⚔️</div><h1>ДУЕЛЬ!</h1><p class="muted">${GameUI.esc(p?.name||'Гравець')} обирає суперника на телефоні.</p></div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='duel_question'){let names=state.players.filter(p=>state.duelPlayers.includes(p.id)).map(p=>GameUI.esc(p.name)).join(' VS ');h=`<div class="center"><div class="huge">⚔️ ДУЕЛЬ</div><h2>${names}</h2></div><div class="question">${GameUI.esc(state.current.q)}</div><div class="row" style="justify-content:center"><button class="btn" id="openDuelBuzz">Відкрити BUZZ для дуелі</button></div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='cat_choose'){h=`<h2>🐈 Кіт у мішку</h2><p class="question">${GameUI.esc(state.current.q)}</p><p class="muted center">Оберіть гравця, який відповідатиме.</p><div class="row" style="justify-content:center">${state.players.map(p=>`<button class="btn secondary catpick" data-id="${p.id}">${GameUI.esc(p.name)}</button>`).join('')}</div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='question'){h=`<div class="question">${GameUI.esc(state.current.q)}</div><div class="row" style="justify-content:center"><button class="btn" id="openBuzz">Відкрити кнопку відповіді</button><button class="btn secondary" id="reveal">Ніхто не відповів</button></div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='buzz'){let locked=(state.answeringLocked||[]).length;h=`<div class="question">${GameUI.esc(state.current.q)}</div><div class="center huge">BUZZ!</div><p class="center muted">${locked?`Уже помилилися: ${locked}. Чекаємо на іншого гравця…`:'Чекаємо на першого гравця…'}</p><div class="row" style="justify-content:center"><button class="btn secondary" id="reveal">Ніхто більше не відповідає</button></div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='answering'){let p=state.players.find(x=>x.id===state.buzzer);h=`<div class="question">${GameUI.esc(state.current.q)}</div><h2 class="center">Відповідає: ${GameUI.esc(p?.name||'')}</h2><div class="row" style="justify-content:center"><button class="btn good" id="correct">Правильно +${state.current.value}</button><button class="btn bad" id="wrong">Неправильно −${state.current.value}</button></div>${GameUI.playersHTML(state.players,state.buzzer)}`}
 else if(state.phase==='cat_question'){let p=state.players.find(x=>x.id===state.catReceiver);h=`<h2 class="center">🐈 Кіт у мішку — відповідає ${GameUI.esc(p?.name||'')}</h2><div class="question">${GameUI.esc(state.current.q)}</div><div class="row" style="justify-content:center"><button class="btn good" id="catCorrect">Правильно +${state.current.value}</button><button class="btn bad" id="catWrong">Неправильно −${state.current.value}</button></div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='result'){let reason=state.resultReason==='all_wrong'?'Усі гравці відповіли неправильно.':state.resultReason==='no_answer'?'Ніхто більше не відповідає.':state.resultReason==='correct'?'Є правильна відповідь!':state.resultReason==='va_bank_wrong'?'ВА-БАНК зіграно неправильно.':'';h=`<div class="question">${GameUI.esc(state.current.q)}</div>${reason?`<p class="center muted">${reason}</p>`:''}<div class="answer"><b>Правильна відповідь:</b> ${GameUI.esc(state.current.a)}</div><div class="row" style="justify-content:center"><button class="btn" id="nextResult">До дошки</button></div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='final_bets'){h=`<h2>Фінал — ставки</h2><p class="muted">Гравці роблять таємні ставки на телефонах.</p>${GameUI.playersHTML(state.players)}<div class="finalList">${state.players.map(p=>`<div class="finalItem"><span>${GameUI.esc(p.name)}</span><b>${p.hasBet?'✅ ставка є':'⏳ чекаємо'}</b></div>`).join('')}</div><button class="btn gold" id="startFinal">Показати фінальне питання</button>`}
 else if(state.phase==='final_ready'){h=`<h2>Фінал — питання відкрите</h2><div class="question">${GameUI.esc(state.current.q)}</div><p class="center muted">Прочитайте запитання вголос. Таймер ще не запущено, поля відповіді на телефонах закриті.</p><div class="row" style="justify-content:center"><button class="btn gold" id="startFinalTimer">▶ Запустити 30 секунд</button></div>${GameUI.playersHTML(state.players)}`}
 else if(state.phase==='final_question'){h=`<h2>Фінал • <span id="finalSeconds">${state.finalSeconds}</span> с</h2><div class="question">${GameUI.esc(state.current.q)}</div><div class="finalList">${state.players.map(p=>`<div class="finalItem"><span>${GameUI.esc(p.name)}</span><b>${p.hasFinalAnswer?'✅ відповідь надіслана':'⏳'}</b></div>`).join('')}</div><button class="btn secondary" id="finishFinal">Завершити зараз</button>`}
 else if(state.phase==='final_review'){h=`<h2>Перевірка фіналу</h2><div class="answer"><b>Правильна відповідь:</b> ${GameUI.esc(state.current.a)}</div><div class="finalList">${state.players.map(p=>`<div class="finalItem"><div><b>${GameUI.esc(p.name)}</b><div class="muted">Відповідь: ${GameUI.esc(p.finalAnswer||'—')}</div></div><label><input type="checkbox" class="finalCorrect" data-id="${p.id}" style="width:auto"> правильно</label></div>`).join('')}</div><button class="btn gold" id="scoreFinal">Порахувати результат</button>`}
 else if(state.phase==='final_result'){
   const total=state.finalResults?.length||0, shown=state.finalRevealCount||0;
   const nextIndex=total-1-shown, nextPlace=nextIndex>=0?nextIndex+1:null;
   h=`<h2>🏆 Фінальна церемонія</h2><p class="muted center">На OBS результати відкриваються від останнього місця до переможця.</p><div class="row" style="justify-content:center;margin:18px 0">${shown<total?`<button class="btn gold" id="revealNextFinal">🎬 ВІДКРИТИ ${nextPlace} МІСЦЕ</button>`:'<div class="winner" style="font-size:26px">🏆 Усі результати відкрито</div>'}</div>${state.finalResults.map((p,i)=>`<div class="finalItem"><span>${i+1}. ${GameUI.esc(p.name)}</span><span>Відповідь: <b>${GameUI.esc(p.finalAnswer||'—')}</b> • ${p.correct?'✅':'❌'} • ставка ${p.bet} • <b>${p.score}</b></span></div>`).join('')}<div class="row" style="justify-content:center;margin-top:22px"><button class="btn" id="restartSame">🔄 Нова гра з цими гравцями</button><button class="btn secondary" id="backMenu">🏠 Головне меню</button></div>`}
 h+=seasonSaveHTML(); h+=seasonManagerHTML(); h+=hostControlsHTML(); app.innerHTML=h; bind(); armFirstTurnClock(); loadSeasonSaveArea(); loadSeasonManagerArea(); }
function bind(){const $=id=>document.getElementById(id); if($('start'))$('start').onclick=()=>emit('startGame'); if($('startFirstTimer'))$('startFirstTimer').onclick=()=>emit('startFirstTurnTimer',{},r=>{if(r&&r.ok===false)alert(r.error)}); if($('skipFirst'))$('skipFirst').onclick=()=>emit('skipFirstTurnQuiz',{},r=>{if(r&&r.ok===false)alert(r.error)}); if($('revealFirst'))$('revealFirst').onclick=()=>emit('revealFirstTurnResults',{},r=>{if(r&&r.ok===false)alert(r.error)}); if($('revealNextFirst'))$('revealNextFirst').onclick=()=>emit('revealNextFirstTurnResult',{},r=>{if(r&&r.ok===false)alert(r.error)}); if($('beginRoundOne'))$('beginRoundOne').onclick=()=>emit('beginRoundOne',{},r=>{if(r&&r.ok===false)alert(r.error)}); if($('restartSame'))$('restartSame').onclick=()=>emit('restartSameGame'); if($('backMenu'))$('backMenu').onclick=()=>{if(confirm('Закрити кімнату й повернутися до головного меню?'))emit('returnToGameMenu')}; if($('newRoom'))$('newRoom').onclick=()=>{if(!confirm('Закрити поточну кімнату й повернутися до вибору гри?'))return;emit('returnToGameMenu',{},()=>{})}; if($('nextRound'))$('nextRound').onclick=()=>emit('nextRound'); if($('finalBets'))$('finalBets').onclick=()=>emit('startFinalBets'); if($('openBuzz'))$('openBuzz').onclick=()=>emit('openBuzz'); if($('reveal'))$('reveal').onclick=()=>emit('revealAnswer'); if($('correct'))$('correct').onclick=()=>emit('judge',{correct:true}); if($('wrong'))$('wrong').onclick=()=>emit('judge',{correct:false}); if($('vbCorrect'))$('vbCorrect').onclick=()=>emit('judgeVaBank',{correct:true}); if($('vbWrong'))$('vbWrong').onclick=()=>emit('judgeVaBank',{correct:false}); if($('openDuelBuzz'))$('openDuelBuzz').onclick=()=>emit('openDuelBuzz'); if($('catCorrect'))$('catCorrect').onclick=()=>emit('judgeCat',{correct:true}); if($('catWrong'))$('catWrong').onclick=()=>emit('judgeCat',{correct:false}); if($('nextResult'))$('nextResult').onclick=()=>emit('nextFromResult'); if($('startFinal'))$('startFinal').onclick=()=>emit('startFinalQuestion',{},r=>{if(!r.ok)alert(r.error)}); if($('startFinalTimer'))$('startFinalTimer').onclick=()=>emit('startFinalTimer',{},r=>{if(r&&r.ok===false)alert(r.error||'Не вдалося запустити таймер')}); if($('finishFinal'))$('finishFinal').onclick=()=>emit('finishFinalNow'); if($('scoreFinal'))$('scoreFinal').onclick=()=>emit('scoreFinal',{results:[...document.querySelectorAll('.finalCorrect')].map(x=>({playerId:x.dataset.id,correct:x.checked}))}); if($('revealNextFinal'))$('revealNextFinal').onclick=()=>emit('revealNextFinalResult',{},r=>{if(r&&r.ok===false)alert(r.error)}); document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>emit('chooseTile',{ci:+b.dataset.ci,qi:+b.dataset.qi})); document.querySelectorAll('.catpick').forEach(b=>b.onclick=()=>emit('selectCatReceiver',{playerId:b.dataset.id}));
 document.querySelectorAll('.scoreQuick').forEach(b=>b.onclick=()=>emit('adjustScore',{playerId:b.dataset.id,amount:+b.dataset.v},r=>{if(r&&r.ok===false)alert(r.error)}));
 document.querySelectorAll('.scoreCustom').forEach(b=>b.onclick=()=>{
   const input=document.querySelector(`.scoreCustomInput[data-id="${b.dataset.id}"]`);
   const amount=Number(input?.value);
   if(!Number.isInteger(amount)||amount===0){alert('Введіть ціле число зі знаком, наприклад +250 або -250.');return}
   emit('adjustScore',{playerId:b.dataset.id,amount},r=>{if(r&&r.ok===false)alert(r.error)});
 });
 if($('pauseGame'))$('pauseGame').onclick=()=>emit('togglePause',{},r=>{if(r&&r.ok===false)alert(r.error)});
 if($('emergencyBuzz'))$('emergencyBuzz').onclick=()=>emit('emergencyReopenBuzz',{},r=>{if(r&&r.ok===false)alert(r.error)});
 if($('emergencyReveal'))$('emergencyReveal').onclick=()=>emit('emergencyRevealQuestion',{},r=>{if(r&&r.ok===false)alert(r.error)});
 if($('emergencyBoard'))$('emergencyBoard').onclick=()=>{
   if(!confirm('Закрити поточне питання та повернутися на дошку?'))return;
   emit('emergencyFinishTile',{},r=>{if(r&&r.ok===false)alert(r.error)});
 };
 if($('stopGame'))$('stopGame').onclick=()=>{
   if(!confirm('Завершити поточну гру? Кімната закриється для всіх гравців та OBS.'))return;
   emit('closeRoom',{},r=>{if(r&&r.ok===false)alert(r.error)});
 };
}
