<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гравець — Своя гра</title><link rel="stylesheet" href="/style.css?v=149"><script src="/socket.io/socket.io.js"></script><script src="/common.js?v=149"></script>
<style>
.mobileBoard{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.mobileCategory{padding:10px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.035)}
.mobileCategoryName{font-size:16px;font-weight:800;line-height:1.2;margin:0 2px 8px;text-align:left;overflow-wrap:anywhere}
.mobileValues{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mobileValues .phoneTile{min-width:0;padding:12px 2px;font-size:13px;line-height:1;font-weight:800}
.mobileValues .phoneTile:disabled{opacity:.32}
@media (max-width:380px){
  .mobileCategory{padding:8px}
  .mobileValues{gap:4px}
  .mobileValues .phoneTile{padding:11px 1px;font-size:12px}
  .mobileCategoryName{font-size:15px}
}
</style>
</head><body><div class="wrap"><div class="brand">SMOKERLOL • PLAYER</div><div id="app" class="panel"></div></div><script>
const socket=io(),app=document.getElementById('app');
let gameData=null, loadedGameId='';

let firstTurnClockHandle=null;
function armFirstTurnClock(){
  if(firstTurnClockHandle){clearInterval(firstTurnClockHandle);firstTurnClockHandle=null}
  const el=document.getElementById('firstTurnTimer');
  const end=Number(state?.firstTurnQuiz?.endsAt||0);
  if(!el||!end||state?.firstTurnQuiz?.timerStatus!=='running')return;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    el.textContent=String(left);
    if(left<=0&&firstTurnClockHandle){clearInterval(firstTurnClockHandle);firstTurnClockHandle=null}
  };
  tick();
  firstTurnClockHandle=setInterval(tick,200);
}

async function ensureGameData(gameId){
 if(!gameId||gameId===loadedGameId)return;
 const r=await fetch(`/games/${encodeURIComponent(gameId)}.json`,{cache:'no-store'});
 if(!r.ok)throw new Error('Game HTTP '+r.status);
 gameData=await r.json();loadedGameId=gameId;
}
const params=new URLSearchParams(location.search);
const urlCode=(params.get('room')||'').trim().toUpperCase();
const savedCode=(localStorage.getItem('sgCode')||'').trim().toUpperCase();
let state=null, code=urlCode||savedCode, playerId=localStorage.getItem('sgPlayerId')||'', name=localStorage.getItem('sgPlayerName')||'';
let joined=false, reconnectTried=false;

function clearSession(keepName=true){
  playerId=''; code=''; state=null; joined=false;
  localStorage.removeItem('sgPlayerId'); localStorage.removeItem('sgCode');
  if(!keepName){ name=''; localStorage.removeItem('sgPlayerName'); }
}
function showError(msg){const e=document.getElementById('err');if(e){e.textContent=msg;e.classList.remove('hidden')}}
function login(prefill=urlCode||''){
  state=null; joined=false;
  const shownCode=prefill||code||'';
  app.innerHTML=`<h1>Приєднатися до гри</h1><input id="code" maxlength="4" autocomplete="off" placeholder="Код кімнати" value="${GameUI.esc(shownCode)}"><br><br><input id="name" maxlength="20" autocomplete="name" placeholder="Ваше ім'я" value="${GameUI.esc(name)}"><br><br><button class="btn" id="join">Увійти</button><div id="err" class="notice hidden"></div>`;
  document.getElementById('join').onclick=()=>{
    const newCode=document.getElementById('code').value.trim().toUpperCase();
    const newName=document.getElementById('name').value.trim();
    if(!newCode)return showError('Введіть код кімнати.');
    if(!newName)return showError("Введіть ім'я.");
    // Якщо користувач свідомо вводить іншу кімнату — старий playerId не переносимо.
    const sameRoom=newCode===savedCode || newCode===code;
    const idToUse=sameRoom?playerId:'';
    socket.emit('joinPlayer',{code:newCode,name:newName,playerId:idToUse},r=>{
      if(!r.ok)return showError(r.error||'Не вдалося приєднатися.');
      playerId=r.playerId; code=r.code; name=r.name; joined=true;
      localStorage.setItem('sgPlayerId',playerId); localStorage.setItem('sgCode',code); localStorage.setItem('sgPlayerName',name);
      history.replaceState(null,'',`/play?room=${encodeURIComponent(code)}`);
    });
  };
}

// Автовідновлення виконуємо лише коли URL не просить іншу кімнату.
login(urlCode||savedCode);
if(playerId&&savedCode&&name&&(!urlCode||urlCode===savedCode)){
  reconnectTried=true;
  socket.emit('joinPlayer',{code:savedCode,name,playerId},r=>{
    if(!r.ok){clearSession(true);login(urlCode||'');return;}
    playerId=r.playerId;code=r.code;name=r.name;joined=true;
    localStorage.setItem('sgPlayerId',playerId);localStorage.setItem('sgCode',code);localStorage.setItem('sgPlayerName',name);
  });
}

socket.on('state',async s=>{
  if(!joined||s.code!==code)return;
  if(s.gameId&&s.gameId!==loadedGameId){try{await ensureGameData(s.gameId)}catch(e){console.error(e)}}
  const prevState=state;
  const prevMe=prevState?.players?.find(p=>p.id===playerId);
  const nextMe=s.players?.find(p=>p.id===playerId);
  state=s;

  // During the running final timer, do NOT rebuild the whole phone UI every second.
  // Replacing the textarea DOM node makes mobile browsers dismiss the keyboard.
  if(prevState?.phase==='final_question' && s.phase==='final_question' &&
     !!prevMe?.hasFinalAnswer===!!nextMe?.hasFinalAnswer){
    const timer=document.getElementById('finalSeconds');
    if(timer)timer.textContent=String(s.finalSeconds);
    return;
  }
  render();
});
socket.on('roomClosed',({code:closedCode,message})=>{if(closedCode!==code)return;clearSession(true);login(urlCode||'');showError(message||'Кімнату закрито.')});
socket.on('serverRestarting',()=>{ /* Socket.IO сам перепідключиться */ });

function me(){return state?.players.find(p=>p.id===playerId)}
function leaveRoom(){
  const oldCode=code;
  socket.emit('leavePlayer',{code:oldCode},()=>{
    clearSession(true); history.replaceState(null,'','/play'); login('');
  });
}
function render(){
  if(!state)return;
  const p=me(); if(!p){clearSession(true);login(urlCode||'');return;}
  let h=`<div class="top"><div><b>${GameUI.esc(p.name)}</b><div class="muted">Кімната ${state.code}</div></div><div class="score">${p.score}</div></div><div class="row" style="justify-content:flex-end"><button class="btn secondary" id="leaveRoom">Вийти з кімнати</button></div>`;
  if(state.phase==='lobby')h+=`<div class="center"><h2>Ви в грі ✅</h2><p class="muted">Чекаємо, поки ведучий почне.</p></div>`;
  else if(state.phase==='first_turn_quiz'){
    const q=state.firstTurnQuiz||{}, submitted=q.submittedPlayerIds||[], status=q.timerStatus||'ready';
    if(submitted.includes(playerId)){
      h+=`<div class="center"><div class="huge">🎯</div><h2>Відповідь зафіксовано ✅</h2>${status==='running'?'<div class="huge"><span id="firstTurnTimer">30</span></div>':''}<p class="muted">Чекаємо на інших гравців.</p></div>`;
    } else if(status==='ready'){
      h+=`<div class="center"><div class="huge">🎯</div><h2>Розіграш першого ходу</h2></div><div class="question" style="font-size:1.2rem">${GameUI.esc(q.question||'')}</div><div class="center"><div class="huge">30</div><p class="muted">Чекаємо, поки ведучий запустить таймер.</p></div>`;
    } else if(status==='expired'){
      h+=`<div class="center"><div class="huge">0</div><h2>⏱ Час вийшов</h2><p class="muted">Відповідь не була зафіксована.</p></div>`;
    } else {
      h+=`<div class="center"><div class="huge"><span id="firstTurnTimer">30</span></div><h2>Розіграш першого ходу</h2></div><div class="question" style="font-size:1.2rem">${GameUI.esc(q.question||'')}</div><input id="firstTurnAnswer" type="number" min="0" step="1" inputmode="numeric" placeholder="Введіть число" autocomplete="off"><br><br><button id="sendFirstTurn" class="btn gold">Підтвердити відповідь</button>`;
    }
  }
  else if(state.phase==='first_turn_result'){const pos=(state.firstTurnQuiz?.results||[]).findIndex(x=>x.id===playerId);h+=`<div class="center"><div class="huge">${pos>=0?pos+1:'—'}</div><h2>Ваш порядок вибору</h2><p class="muted">Чекаємо початку 1 раунду.</p></div>`}
  else if(state.phase==='board'){
    const chooser=state.players.find(x=>x.id===state.turnPlayerId);
    if(state.turnPlayerId===playerId && gameData){
      const cats=gameData.rounds[state.round].categories;
      h+=`<div class="center"><h2>🎯 Ваша черга обирати питання</h2><p class="muted">Раунд ${state.round+1}</p></div><div class="mobileBoard">${cats.map((c,ci)=>`<section class="mobileCategory"><div class="mobileCategoryName">${GameUI.esc(c.name)}</div><div class="mobileValues">${c.questions.map((q,qi)=>{const used=state.used[`${state.round}:${ci}:${qi}`];return `<button class="btn phoneTile" data-ci="${ci}" data-qi="${qi}" ${used?'disabled':''}>${used?'—':q.value}</button>`}).join('')}</div></section>`).join('')}</div>`;
    } else h+=`<div class="center"><h2>Питання обирає ${GameUI.esc(chooser?.name||'інший гравець')}</h2><p class="muted">Чекаємо вашої черги.</p></div>`;
  }
  else if(state.phase==='question')h+=`<div class="center"><h2>Увага, питання!</h2><p class="muted">Кнопка відповіді ще закрита.</p></div>`;
  else if(state.phase==='buzz'){
    if(state.current?.type==='duel' && !state.duelPlayers.includes(playerId)) h+=`<div class="center"><h2>⚔️ Дуель</h2><p class="muted">Відповідають учасники дуелі.</p></div>`;
    else h+=`<button id="buzz" class="btn buzz">Я ВІДПОВІДАЮ!</button>`;
  }
  else if(state.phase==='answering')h+=state.buzzer===playerId?`<div class="center"><div class="huge">ВИ!</div><h2>Відповідайте вголос</h2></div>`:`<div class="center"><h2>Відповідає інший гравець</h2></div>`;
  else if(state.phase==='va_bank_bet'){
    if(state.vaBankPlayer===playerId){let max=Math.max(0,p.score);h+=`<div class="center"><div class="huge">🎰</div><h2>ВА-БАНК!</h2></div><p>Ваша ставка: від 0 до ${max}</p><input id="vbBet" type="number" min="0" max="${max}" value="${max}"><br><br><button id="sendVbBet" class="btn gold">Підтвердити ставку</button>`}
    else h+=`<div class="center"><div class="huge">🎰</div><h2>ВА-БАНК!</h2><p class="muted">Гравець робить ставку.</p></div>`;
  }
  else if(state.phase==='va_bank_question')h+=state.vaBankPlayer===playerId?`<div class="center"><div class="huge">🎰</div><h2>ВА-БАНК — відповідаєте ви!</h2><p>Ставка: ${state.vaBankBet}</p></div>`:`<div class="center"><h2>🎰 ВА-БАНК</h2><p>Відповідає інший гравець.</p></div>`;
  else if(state.phase==='duel_choose'){
    if(state.turnPlayerId===playerId){h+=`<div class="center"><div class="huge">⚔️</div><h2>ДУЕЛЬ!</h2><p>Оберіть суперника</p></div><div class="row" style="justify-content:center">${state.players.filter(x=>x.id!==playerId).map(x=>`<button class="btn secondary duelpick" data-id="${x.id}">${GameUI.esc(x.name)}</button>`).join('')}</div>`}
    else h+=`<div class="center"><div class="huge">⚔️</div><h2>ДУЕЛЬ!</h2><p class="muted">Суперника обирає ${GameUI.esc(state.players.find(x=>x.id===state.turnPlayerId)?.name||'гравець')}.</p></div>`;
  }
  else if(state.phase==='duel_question')h+=state.duelPlayers.includes(playerId)?`<div class="center"><div class="huge">⚔️</div><h2>Ви в дуелі!</h2><p class="muted">Слухайте питання. Ведучий скоро відкриє BUZZ.</p></div>`:`<div class="center"><h2>⚔️ Триває дуель</h2><p class="muted">У цьому питанні відповідають двоє гравців.</p></div>`;
  else if(state.phase==='cat_choose'){
    if(state.catChooser===playerId){h+=`<div class="center"><div class="huge">🐈</div><h2>Кіт у мішку!</h2><p>Передайте питання іншому гравцеві</p></div><div class="row" style="justify-content:center">${state.players.filter(x=>x.id!==playerId).map(x=>`<button class="btn secondary catpick" data-id="${x.id}">${GameUI.esc(x.name)}</button>`).join('')}</div>`}
    else h+=`<div class="center"><h2>🐈 Кіт у мішку</h2><p>Гравець обирає, кому передати питання.</p></div>`;
  }
  else if(state.phase==='cat_question')h+=state.catReceiver===playerId?`<div class="center"><div class="huge">🐈</div><h2>Кіт у мішку — відповідаєте ви!</h2></div>`:`<div class="center"><h2>Кіт у мішку дістався іншому гравцю.</h2></div>`;
  else if(state.phase==='result')h+=`<div class="center"><h2>Результат зафіксовано</h2></div>`;
  else if(state.phase==='final_bets'){let max=Math.max(0,p.score);h+=p.hasBet?`<div class="center"><h2>Ставку прийнято ✅</h2></div>`:`<h2>Фінальна ставка</h2><p>Від 0 до ${max}</p><input id="bet" type="number" min="0" max="${max}" value="${max}"><br><br><button id="sendBet" class="btn gold">Підтвердити ставку</button>`}
  else if(state.phase==='final_ready'){h+=`<div class="center"><h2>Фінальне питання</h2><p class="muted">Слухайте ведучого. Таймер ще не запущено.</p><div class="huge">30</div></div>`}
  else if(state.phase==='final_question'){h+=p.hasFinalAnswer?`<div class="center"><h2>Відповідь надіслана ✅</h2><div class="huge"><span id="finalSeconds">${state.finalSeconds}</span></div></div>`:`<h2>Фінал • <span id="finalSeconds">${state.finalSeconds}</span> с</h2><textarea id="finalAnswer" rows="5" placeholder="Введіть відповідь" autocomplete="off"></textarea><br><br><button id="sendFinal" class="btn">Надіслати відповідь</button>`}
  else if(state.phase==='final_review')h+=`<div class="center"><h2>Відповіді перевіряє ведучий</h2></div>`;
  else if(state.phase==='final_result')h+=`<div class="center"><h2>🏆 Гру завершено</h2><div class="huge">${p.score}</div></div>`;
  app.innerHTML=h;
  armFirstTurnClock();
  document.getElementById('leaveRoom').onclick=leaveRoom;
  if(document.getElementById('buzz'))document.getElementById('buzz').onclick=()=>socket.emit('buzz',{code});
  if(document.getElementById('sendFirstTurn'))document.getElementById('sendFirstTurn').onclick=()=>{
    const answer=document.getElementById('firstTurnAnswer').value;
    socket.emit('submitFirstTurnAnswer',{code,answer},r=>{
      if(r&&r.ok===false){alert(r.error);return}
      if(r?.ok){
        state.firstTurnQuiz.submittedPlayerIds=r.submittedPlayerIds||[...(state.firstTurnQuiz.submittedPlayerIds||[]),playerId];
        render();
      }
    });
  };
  document.querySelectorAll('.phoneTile').forEach(b=>b.onclick=()=>socket.emit('chooseTile',{code,ci:+b.dataset.ci,qi:+b.dataset.qi},r=>{if(r&&r.ok===false)alert(r.error)}));
  document.querySelectorAll('.catpick').forEach(b=>b.onclick=()=>socket.emit('selectCatReceiver',{code,playerId:b.dataset.id},r=>{if(r&&r.ok===false)alert(r.error)}));
  document.querySelectorAll('.duelpick').forEach(b=>b.onclick=()=>socket.emit('selectDuelOpponent',{code,playerId:b.dataset.id},r=>{if(r&&r.ok===false)alert(r.error)}));
  if(document.getElementById('sendVbBet'))document.getElementById('sendVbBet').onclick=()=>socket.emit('submitVaBankBet',{code,bet:document.getElementById('vbBet').value},r=>{if(r&&r.ok===false)alert(r.error)});
  if(document.getElementById('sendBet'))document.getElementById('sendBet').onclick=()=>socket.emit('submitBet',{code,bet:document.getElementById('bet').value},r=>{if(!r.ok)alert('Не вдалося зберегти ставку')});
  if(document.getElementById('sendFinal'))document.getElementById('sendFinal').onclick=()=>{
    const answer=document.getElementById('finalAnswer').value;
    socket.emit('submitFinalAnswer',{code,answer},r=>{if(r&&r.ok===false)alert('Не вдалося надіслати відповідь')});
  };
}
</script></body></html>
