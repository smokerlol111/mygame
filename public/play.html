<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гравець — Своя гра</title><link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script><script src="/common.js"></script></head><body><div class="wrap"><div class="brand">SMOKERLOL • PLAYER</div><div id="app" class="panel"></div></div><script>
const socket=io(),app=document.getElementById('app');let state=null,code=new URLSearchParams(location.search).get('room')||localStorage.getItem('sgCode')||'',playerId=localStorage.getItem('sgPlayerId')||'',name=localStorage.getItem('sgPlayerName')||'';
function login(){app.innerHTML=`<h1>Приєднатися до гри</h1><input id="code" placeholder="Код кімнати" value="${GameUI.esc(code)}"><br><br><input id="name" placeholder="Ваше ім'я" value="${GameUI.esc(name)}"><br><br><button class="btn" id="join">Увійти</button><div id="err" class="notice hidden"></div>`;document.getElementById('join').onclick=()=>{code=document.getElementById('code').value.trim().toUpperCase();name=document.getElementById('name').value.trim();socket.emit('joinPlayer',{code,name,playerId},r=>{if(!r.ok){let e=document.getElementById('err');e.textContent=r.error;e.classList.remove('hidden');return}playerId=r.playerId;code=r.code;name=r.name;localStorage.setItem('sgPlayerId',playerId);localStorage.setItem('sgCode',code);localStorage.setItem('sgPlayerName',name)})}}
login(); if(code&&playerId&&name) socket.emit('joinPlayer',{code,name,playerId},r=>{if(!r.ok)login()});
socket.on('state',s=>{if(code&&s.code!==code)return;state=s;code=s.code;render()});
function me(){return state?.players.find(p=>p.id===playerId)}
function render(){if(!state)return;let p=me();if(!p)return login();let h=`<div class="top"><div><b>${GameUI.esc(p.name)}</b><div class="muted">Кімната ${state.code}</div></div><div class="score">${p.score}</div></div>`;
 if(state.phase==='lobby')h+=`<div class="center"><h2>Ви в грі ✅</h2><p class="muted">Чекаємо, поки ведучий почне.</p></div>`;
 else if(state.phase==='board')h+=`<div class="center"><h2>Оберіть питання на головному екрані</h2><p class="muted">Раунд ${state.round+1}</p></div>`;
 else if(state.phase==='question')h+=`<div class="center"><h2>Увага, питання!</h2><p class="muted">Кнопка відповіді ще закрита.</p></div>`;
 else if(state.phase==='buzz'){h+=`<button id="buzz" class="btn buzz">Я ВІДПОВІДАЮ!</button>`}
 else if(state.phase==='answering'){h+=state.buzzer===playerId?`<div class="center"><div class="huge">ВИ!</div><h2>Відповідайте вголос</h2></div>`:`<div class="center"><h2>Відповідає інший гравець</h2></div>`}
 else if(state.phase==='cat_choose')h+=`<div class="center"><h2>🐈 Кіт у мішку</h2><p>Ведучий обирає того, хто відповідатиме.</p></div>`;
 else if(state.phase==='cat_question')h+=state.catReceiver===playerId?`<div class="center"><div class="huge">🐈</div><h2>Кіт у мішку — відповідаєте ви!</h2></div>`:`<div class="center"><h2>Кіт у мішку дістався іншому гравцю.</h2></div>`;
 else if(state.phase==='result')h+=`<div class="center"><h2>Результат зафіксовано</h2></div>`;
 else if(state.phase==='final_bets'){let max=Math.max(0,p.score);h+=p.hasBet?`<div class="center"><h2>Ставку прийнято ✅</h2></div>`:`<h2>Фінальна ставка</h2><p>Від 0 до ${max}</p><input id="bet" type="number" min="0" max="${max}" value="${max}"><br><br><button id="sendBet" class="btn gold">Підтвердити ставку</button>`}
 else if(state.phase==='final_question'){h+=p.hasFinalAnswer?`<div class="center"><h2>Відповідь надіслана ✅</h2><div class="huge">${state.finalSeconds}</div></div>`:`<h2>Фінал • ${state.finalSeconds} с</h2><textarea id="finalAnswer" rows="5" placeholder="Введіть відповідь"></textarea><br><br><button id="sendFinal" class="btn">Надіслати відповідь</button>`}
 else if(state.phase==='final_review')h+=`<div class="center"><h2>Відповіді перевіряє ведучий</h2></div>`;
 else if(state.phase==='final_result')h+=`<div class="center"><h2>🏆 Гру завершено</h2><div class="huge">${p.score}</div></div>`;
 app.innerHTML=h;if(document.getElementById('buzz'))document.getElementById('buzz').onclick=()=>socket.emit('buzz',{code});if(document.getElementById('sendBet'))document.getElementById('sendBet').onclick=()=>socket.emit('submitBet',{code,bet:document.getElementById('bet').value},r=>{if(!r.ok)alert('Не вдалося зберегти ставку')});if(document.getElementById('sendFinal'))document.getElementById('sendFinal').onclick=()=>socket.emit('submitFinalAnswer',{code,answer:document.getElementById('finalAnswer').value});}
</script></body></html>
