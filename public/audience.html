<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMOKERLOL — Глядачі</title><link rel="stylesheet" href="/style.css?v=168"><script src="/socket.io/socket.io.js"></script><script src="/common.js?v=168"></script><style>
body{min-height:100vh}.aud{max-width:720px;margin:auto;padding:18px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.answers button{min-height:92px;font-size:20px;font-weight:900}.timer{font-size:72px;font-weight:1000;text-align:center}.bigwin{font-size:42px;font-weight:1000}.locked{opacity:.55;pointer-events:none}@media(max-width:600px){.answers{grid-template-columns:1fr}.answers button{min-height:76px}.timer{font-size:58px}}
</style></head><body><div class="aud" id="app"></div><script>
const socket=io(),app=document.getElementById('app');let state=null;let code=location.pathname.split('/').filter(Boolean)[1]||new URLSearchParams(location.search).get('code')||'';let prizeCode='';let aid=localStorage.getItem('smokerlolAudienceId_'+code)||'';let name=localStorage.getItem('smokerlolAudienceName_'+code)||'';let clock=null;
const esc=s=>GameUI.esc(String(s??''));function join(){if(!code)return;socket.emit('joinAudience',{code,name,audienceId:aid},r=>{if(r?.ok){aid=r.audienceId;name=r.name;localStorage.setItem('smokerlolAudienceId_'+code,aid);localStorage.setItem('smokerlolAudienceName_'+code,name)}else if(state?.phase==='audience_lobby')render(r?.error)})}
socket.on('audiencePrize',x=>{prizeCode=x?.code||'';render()});socket.on('connect',()=>{if(aid)join()});socket.on('state',s=>{if(code&&s.code!==code)return;state=s;code=s.code;render()});socket.on('roomClosed',()=>app.innerHTML='<div class="panel center"><h1>Гру завершено</h1></div>');
function arm(){clearInterval(clock);const el=document.getElementById('audTimer'),end=Number(state?.audience?.endsAt||0);if(!el||!end)return;const tick=()=>{el.textContent=(Math.max(0,end-Date.now())/1000).toFixed(1)};tick();clock=setInterval(tick,100)}
function render(err=''){const a=state?.audience;if(!state){app.innerHTML=`<div class="panel"><h1>SMOKERLOL • ГЛЯДАЧІ</h1><input id="code" placeholder="Код кімнати" value="${esc(code)}"><button class="btn gold" id="go">Підключитися</button></div>`;document.getElementById('go').onclick=()=>{code=document.getElementById('code').value.trim().toUpperCase();location.href='/audience/'+code};return}
if(!aid){app.innerHTML=`<div class="panel center"><h1>👥 ГРАЮТЬ ГЛЯДАЧІ</h1><p>${esc(a?.title||'')}</p>${err?`<p class="bad">${esc(err)}</p>`:''}<input id="nick" maxlength="24" placeholder="Твій нік"><button class="btn gold" id="join">ПРИЄДНАТИСЯ</button></div>`;document.getElementById('join').onclick=()=>{name=document.getElementById('nick').value.trim();join()};return}
if(!a){app.innerHTML=`<div class="panel center"><h2>Привіт, ${esc(name)} 👋</h2><p>Чекай на наступну гру для глядачів.</p></div>`;return}
if(state.phase==='audience_lobby'){app.innerHTML=`<div class="panel center"><div class="huge">🎁</div><h1>${esc(a.title)}</h1><h2>${esc(name)}, ти у грі!</h2><p>3 питання • 15 секунд • правильність важливіша за швидкість</p><p class="muted">Учасників: ${a.joined}</p></div>`}
else if(state.phase==='audience_question'){const submitted=a.submittedPlayerIds?.includes?.(aid);app.innerHTML=`<div class="panel"><div class="timer" id="audTimer">15.0</div><h2 class="center">ПИТАННЯ ${a.questionIndex+1}/${a.totalQuestions}</h2><div class="question">${esc(a.question)}</div><div class="answers">${a.options.map((o,i)=>`<button class="btn ${submitted?'locked':''}" data-o="${i}">${'ABCD'[i]} • ${esc(o)}</button>`).join('')}</div>${submitted?'<p class="center good"><b>✅ Відповідь зафіксована</b></p>':''}</div>`;if(!submitted)document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>socket.emit('submitAudienceAnswer',{code,option:+b.dataset.o},r=>{if(!r?.ok)alert(r.error)}));arm()}
else if(state.phase==='audience_result'){const c=a.correct;app.innerHTML=`<div class="panel center"><h2>ПРАВИЛЬНА ВІДПОВІДЬ</h2><div class="bigwin">${'ABCD'[c]} • ${esc(a.options[c])}</div><p>${esc(a.fact)}</p><p class="muted">Чекаємо наступне питання…</p></div>`}
else if(state.phase==='audience_podium'){const me=(a.ranking||[]).find(x=>x.id===aid);const winner=a.winner;app.innerHTML=`<div class="panel center"><div class="huge">🏆</div>${winner?.id===aid?`<h1>ТИ ПЕРЕМІГ!</h1><p>Код переможця:</p><div class="bigwin">${esc(prizeCode)}</div><p>Зроби скрін цього екрана.</p>`:`<h1>РЕЗУЛЬТАТИ</h1><h2>${me?`${me.correct}/3 правильних`:''}</h2><p>${winner?`Переможець: <b>${esc(winner.name)}</b>`:'Ведучий відкриває результати…'}</p>`}</div>`}
else app.innerHTML=`<div class="panel center"><h2>${esc(name)}, чекай на глядацький раунд 👀</h2></div>`}
</script></body></html>
