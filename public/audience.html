<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SMOKERLOL — Глядачі</title>
    <link rel="stylesheet" href="/style.css?v=1612" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="/common.js?v=1612"></script>
    <style>
      body {
        min-height: 100vh;
      }
      .aud {
        max-width: 720px;
        margin: auto;
        padding: 18px;
      }
      #nick {
        display: block;
        margin: 0 auto 16px;
      }
      .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 18px;
      }
      .answers button {
        min-height: 92px;
        font-size: 20px;
        font-weight: 900;
      }
      .timer {
        font-size: 72px;
        font-weight: 1000;
        text-align: center;
      }
      .bigwin {
        font-size: 42px;
        font-weight: 1000;
      }
      .locked {
        opacity: 0.55;
        pointer-events: none;
      }
      .audNotice {
        padding: 10px 14px;
        border-radius: 12px;
        margin: 12px 0;
        background: rgba(235, 170, 70, 0.12);
        border: 1px solid rgba(235, 170, 70, 0.48);
        text-align: center;
      }
      .audNotice button {
        margin-top: 10px;
      }
      .audStatus {
        margin: 12px auto;
        text-align: center;
      }
      .audStatus:empty {
        display: none;
      }
      .audRetry[hidden] {
        display: none !important;
      }
      .audRetry {
        display: block;
        margin: 8px auto;
      }
      @media (max-width: 600px) {
        .answers {
          grid-template-columns: 1fr;
        }
        .answers button {
          min-height: 76px;
        }
        .timer {
          font-size: 58px;
        }
      }
    </style>
  </head>
  <body>
    <div class="aud" id="app">
      <div class="panel center">
        <h1>👥 SMOKERLOL • ГЛЯДАЧІ</h1>
        <p class="muted">Підключення до кімнати…</p>
      </div>
    </div>
    <script>
      const socket = io(),
        app = document.getElementById("app");
      let state = null;
      let code =
        location.pathname.split("/").filter(Boolean)[1] || new URLSearchParams(location.search).get("code") || "";
      let prizeCode = localStorage.getItem("smokerlolAudiencePrize_" + code) || "";
      let aid = localStorage.getItem("smokerlolAudienceId_" + code) || "";
      let akey = localStorage.getItem("smokerlolAudienceKey_" + code) || "";
      let name = localStorage.getItem("smokerlolAudienceName_" + code) || "";
      let clock = null;
      let audienceReady = false,
        joinPending = false,
        restoreError = "",
        connectionError = "",
        answerPending = null,
        answerNotice = "";
      let joinAttempt = 0,
        recoverAttempt = 0;
      function questionKey(s) {
        return s?.audience ? [s.audience.roundIndex, s.audience.questionIndex].join(":") : "";
      }
      function showConnectionBanner() {
        const old = document.getElementById("audConnectionNotice");
        if (old) old.remove();
        if (!state || !aid || !audienceReady) return;
        if (!socket.connected || connectionError) {
          const banner = document.createElement("div");
          banner.id = "audConnectionNotice";
          banner.className = "audNotice";
          banner.textContent = connectionError || "З’єднання втрачено. Відновлюємо участь…";
          app.prepend(banner);
        }
      }
      function refreshAnswerUI() {
        if (state?.phase !== "audience_question") return;
        const submitted = !!state.audience?.submittedPlayerIds?.includes?.(aid);
        const waiting = !!answerPending && answerPending.key === questionKey(state);
        const locked = submitted || waiting || !socket.connected || !audienceReady;
        document.querySelectorAll("[data-o]").forEach(b => {
          b.disabled = locked;
          b.classList.toggle("locked", locked);
        });
        const status = document.getElementById("audAnswerStatus");
        if (status) {
          status.textContent = submitted
            ? "✅ Відповідь зафіксована"
            : answerNotice || (waiting ? "Надсилаємо відповідь…" : "");
          status.className = "audStatus " + (submitted ? "good" : "muted");
        }
        const retry = document.getElementById("retryAnswerCheck");
        if (retry) retry.hidden = !(waiting && answerPending.uncertain);
      }
      function recoverAudience() {
        if (!code) {
          render();
          return;
        }
        if (!socket.connected) {
          connectionError = "Немає зв’язку із сервером. Спробуй ще раз, коли з’єднання відновиться.";
          render();
          return;
        }
        restoreError = "";
        connectionError = "";
        const attempt = ++recoverAttempt;
        socket.timeout(8000).emit("getAudienceState", { code }, (err, r) => {
          if (attempt !== recoverAttempt) return;
          if (err) {
            connectionError = "Сервер не відповідає. Перевір інтернет і повтори спробу.";
            render();
            return;
          }
          if (!r?.ok) {
            state = null;
            connectionError = r?.error || "Кімнату не знайдено.";
            render(connectionError);
            return;
          }
          if (aid) join();
          else if (document.activeElement?.id !== "nick") render();
        });
      }
      function checkAudienceAnswer() {
        const pending = answerPending;
        if (!pending || pending.checking) return;
        if (!socket.connected) {
          pending.uncertain = true;
          answerNotice = "Зв’язок втрачено. Після підключення перевір, чи прийнята відповідь.";
          refreshAnswerUI();
          return;
        }
        pending.checking = true;
        answerNotice = "Перевіряємо відповідь на сервері…";
        refreshAnswerUI();
        socket.timeout(6500).emit("getAudienceState", { code }, (err, r) => {
          if (answerPending !== pending) return;
          pending.checking = false;
          if (err || !r?.ok) {
            pending.uncertain = true;
            answerNotice = "Не вдалося перевірити відповідь. Натисни «Перевірити ще раз».";
            refreshAnswerUI();
            return;
          }
          if (state?.audience?.submittedPlayerIds?.includes?.(aid) && questionKey(state) === pending.key) {
            answerPending = null;
            answerNotice = "";
            markAudienceSubmitted();
            return;
          }
          // Only a fresh server snapshot may re-enable the answer buttons.
          answerPending = null;
          answerNotice =
            state?.phase === "audience_question" && questionKey(state) === pending.key
              ? "На сервері відповідь не знайдено. Якщо час залишився, можеш спробувати ще раз."
              : "";
          refreshAnswerUI();
        });
      }
      function sendAudienceAnswer(option) {
        const aq = state?.audience;
        if (
          !audienceReady
          || !socket.connected
          || !aid
          || !aq
          || state.phase !== "audience_question"
          || answerPending
          || aq.submittedPlayerIds?.includes?.(aid)
        )
          return;
        const pending = { key: questionKey(state), uncertain: false, checking: false };
        answerPending = pending;
        answerNotice = "Надсилаємо відповідь…";
        refreshAnswerUI();
        socket.timeout(6500).emit("submitAudienceAnswer", { code, option }, (err, r) => {
          if (answerPending !== pending) return;
          if (err) {
            pending.uncertain = true;
            answerNotice = "Немає підтвердження. Перевіряємо відповідь…";
            checkAudienceAnswer();
            return;
          }
          if (r?.ok || r?.error === "Відповідь уже зафіксована.") {
            answerPending = null;
            answerNotice = "";
            markAudienceSubmitted();
            return;
          }
          answerPending = null;
          answerNotice = r?.error || "Не вдалося надіслати відповідь.";
          refreshAnswerUI();
        });
      }

      const esc = s => GameUI.esc(String(s ?? ""));
      function join() {
        if (!code || joinPending) return;
        if (!socket.connected) {
          restoreError = "Немає підключення. Спробуй ще раз після відновлення мережі.";
          render(restoreError);
          return;
        }
        const previousId = aid;
        const attempt = ++joinAttempt;
        joinPending = true;
        restoreError = "";
        if (previousId) render();
        socket.timeout(7000).emit("joinAudience", { code, name, audienceKey: akey }, (err, r) => {
          if (attempt !== joinAttempt) return;
          joinPending = false;
          if (err || !r?.ok) {
            audienceReady = false;
            restoreError = err
              ? "Сервер не підтвердив підключення. Натисни «Спробувати ще раз»."
              : r?.error || "Не вдалося підключитися.";
            render(restoreError);
            return;
          }
          aid = r.audienceId;
          akey = r.audienceKey;
          name = r.name;
          audienceReady = true;
          restoreError = "";
          connectionError = "";
          localStorage.setItem("smokerlolAudienceId_" + code, aid);
          localStorage.setItem("smokerlolAudienceKey_" + code, akey);
          localStorage.setItem("smokerlolAudienceName_" + code, name);
          if (r.prizeCode) {
            prizeCode = r.prizeCode;
            localStorage.setItem("smokerlolAudiencePrize_" + code, prizeCode);
          }
          if (state?.audience && Number.isFinite(Number(r.joined))) state.audience.joined = Number(r.joined);
          render();
        });
      }
      socket.on("audiencePrize", x => {
        prizeCode = x?.code || "";
        if (prizeCode) localStorage.setItem("smokerlolAudiencePrize_" + code, prizeCode);
        render();
      });
      socket.on("audienceProgress", x => {
        if (!state || x.code !== code || !state.audience) return;
        // Ignore progress packets from a previous question.
        if (x.roundIndex !== state.audience.roundIndex || x.questionIndex !== state.audience.questionIndex) return;
        state.audience.joined = Number(x.joined || 0);
        state.audience.submitted = Number(x.submitted || 0);
        const joined = document.getElementById("audienceJoined");
        if (joined) joined.textContent = String(state.audience.joined);
      });
      socket.on("connect", () => {
        connectionError = "";
        audienceReady = false;
        if (!aid) render();
        recoverAudience();
      });
      socket.on("connect_error", () => {
        connectionError = "Не вдалося підключитися до сервера. Перевір мережу.";
        if (!state) render();
        else showConnectionBanner();
      });
      socket.on("disconnect", () => {
        audienceReady = false;
        joinPending = false;
        joinAttempt++;
        recoverAttempt++;
        if (clock) {
          clearInterval(clock);
          clock = null;
        }
        connectionError = "З’єднання втрачено. Очікуємо відновлення…";
        render();
      });
      socket.on("state", s => {
        if (code && s.code !== code) return;
        const prevPhase = state?.phase;
        state = s;
        code = s.code;
        if (answerPending && (s.phase !== "audience_question" || questionKey(s) !== answerPending.key)) {
          answerPending = null;
          answerNotice = "";
        }
        if (!aid && prevPhase === s.phase && document.activeElement?.id === "nick") return;
        render();
      });
      socket.on("roomClosed", () => {
        audienceReady = false;
        answerPending = null;
        if (clock) clearInterval(clock);
        app.innerHTML = '<div class="panel center"><h1>Гру завершено</h1></div>';
      });
      function arm() {
        if (clock) {
          clearInterval(clock);
          clock = null;
        }
        const el = document.getElementById("audTimer");
        const ms = Math.max(0, Number(state?.audience?.remainingMs || 0));
        if (!el) return;
        const end = Date.now() + ms;
        const tick = () => {
          const left = Math.max(0, end - Date.now());
          el.textContent = (left / 1000).toFixed(1);
          if (left <= 0 && clock) {
            clearInterval(clock);
            clock = null;
          }
        };
        tick();
        if (ms > 0) clock = setInterval(tick, 100);
      }
      function markAudienceSubmitted() {
        if (!state?.audience || !aid) return;
        const ids = state.audience.submittedPlayerIds || [];
        if (!ids.includes(aid)) state.audience.submittedPlayerIds = [...ids, aid];
        refreshAnswerUI();
      }
      function render(err = "") {
        if (state?.phase !== "audience_question" && clock) {
          clearInterval(clock);
          clock = null;
        }
        const a = state?.audience;
        if (!state) {
          const message = err || connectionError;
          app.innerHTML = `<div class="panel center"><h1>SMOKERLOL • ГЛЯДАЧІ</h1><p class="${message ? "bad" : "muted"}">${esc(message || "Підключення до кімнати…")}</p><input id="code" placeholder="Код кімнати" value="${esc(code)}"><button class="btn gold" id="go">ПІДКЛЮЧИТИСЯ</button>${code ? '<button class="btn secondary" id="retryConnection" style="margin-top:10px">🔄 ПОВТОРИТИ ПІДКЛЮЧЕННЯ</button>' : ""}</div>`;
          document.getElementById("go").onclick = () => {
            code = document.getElementById("code").value.trim().toUpperCase();
            location.href = "/audience/" + code;
          };
          const retry = document.getElementById("retryConnection");
          if (retry) retry.onclick = recoverAudience;
          return;
        }
        if (aid && !audienceReady) {
          app.innerHTML = `<div class="panel center"><h1>👥 ГЛЯДАЧІ</h1><p class="${restoreError || connectionError ? "bad" : "muted"}">${esc(restoreError || connectionError || (joinPending ? "Відновлюємо участь…" : "Перевіряємо сесію…"))}</p><button class="btn gold" id="retryAudience" ${joinPending ? "disabled" : ""}>🔄 ПОВТОРИТИ ПІДКЛЮЧЕННЯ</button></div>`;
          document.getElementById("retryAudience").onclick = () => {
            if (socket.connected) join();
            else recoverAudience();
          };
          return;
        }
        if (!aid) {
          app.innerHTML = `<div class="panel center"><h1>👥 ГРАЮТЬ ГЛЯДАЧІ</h1><p>${esc(a?.title || "")}</p>${err || restoreError ? `<p class="bad">${esc(err || restoreError)}</p>` : ""}<input id="nick" maxlength="24" placeholder="Твій нік" value="${esc(name)}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="btn gold" id="join" ${joinPending ? "disabled" : ""}>ПРИЄДНАТИСЯ</button></div>`;
          const nick = document.getElementById("nick");
          nick.oninput = () => {
            name = nick.value;
          };
          document.getElementById("join").onclick = () => {
            name = nick.value.trim();
            join();
          };
          return;
        }
        if (!a) {
          app.innerHTML = `<div class="panel center"><h2>Привіт, ${esc(name)} 👋</h2><p>Чекай на наступну гру для глядачів.</p></div>`;
          return;
        }
        if (state.phase === "audience_lobby") {
          app.innerHTML = `<div class="panel center"><div class="huge">🎁</div><h1>${esc(a.title)}</h1><h2>${esc(name)}, ти у грі!</h2><p>${a.totalQuestions} питання • ${a.questionSeconds || 15} секунд • правильність важливіша за швидкість</p><p class="muted">Учасників: <span id="audienceJoined">${a.joined}</span></p></div>`;
        } else if (state.phase === "audience_question") {
          const submitted = !!a.submittedPlayerIds?.includes?.(aid);
          const waiting = !!answerPending && answerPending.key === questionKey(state);
          const locked = submitted || waiting || !socket.connected;
          const status = submitted
            ? "✅ Відповідь зафіксована"
            : answerNotice || (waiting ? "Надсилаємо відповідь…" : "");
          app.innerHTML = `<div class="panel"><div class="timer" id="audTimer">${a.questionSeconds || 15}.0</div><h2 class="center">ПИТАННЯ ${a.questionIndex + 1}/${a.totalQuestions}</h2><div class="question">${esc(a.question)}</div><div class="answers">${a.options.map((o, i) => `<button class="btn ${locked ? "locked" : ""}" data-o="${i}" ${locked ? "disabled" : ""}>${"ABCD"[i]} • ${esc(o)}</button>`).join("")}</div><div class="audStatus ${submitted ? "good" : "muted"}" id="audAnswerStatus">${esc(status)}</div><button class="btn secondary audRetry" id="retryAnswerCheck" ${waiting && answerPending.uncertain ? "" : "hidden"}>🔄 ПЕРЕВІРИТИ ВІДПОВІДЬ</button></div>`;
          if (!locked)
            document.querySelectorAll("[data-o]").forEach(b => (b.onclick = () => sendAudienceAnswer(+b.dataset.o)));
          const retry = document.getElementById("retryAnswerCheck");
          if (retry) retry.onclick = checkAudienceAnswer;
          arm();
        } else if (state.phase === "audience_result") {
          const c = a.correct;
          app.innerHTML = `<div class="panel center"><h2>ПРАВИЛЬНА ВІДПОВІДЬ</h2><div class="bigwin">${"ABCD"[c]} • ${esc(a.options[c])}</div><p>${esc(a.fact)}</p><p class="muted">Чекаємо наступне питання…</p></div>`;
        } else if (state.phase === "audience_podium") {
          const me = (a.ranking || []).find(x => x.id === aid);
          const winner = a.winner;
          app.innerHTML = `<div class="panel center"><div class="huge">🏆</div>${winner?.id === aid ? `<h1>ТИ ПЕРЕМІГ!</h1><p>Код переможця:</p><div class="bigwin">${esc(prizeCode)}</div><p>Зроби скрін цього екрана.</p>` : `<h1>РЕЗУЛЬТАТИ</h1><h2>${me ? `${me.correct}/3 правильних` : ""}</h2><p>${winner ? `Переможець: <b>${esc(winner.name)}</b>` : "Ведучий відкриває результати…"}</p>`}</div>`;
        } else app.innerHTML = `<div class="panel center"><h2>${esc(name)}, чекай на глядацький раунд 👀</h2></div>`;
        showConnectionBanner();
      }
    </script>
  </body>
</html>
