<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Класичний квіз · Команда</title><link rel="stylesheet" href="/classic/classic.css"><script src="/socket.io/socket.io.js" defer></script><script src="/classic/common.js" defer></script><script src="/classic/play.js" defer></script></head>
<body><main style="max-width:760px"><header><a href="/">← Головна</a><span class="brand">SMOKERLOL · КОМАНДА</span><span id="network" class="pill">З’єднуємося…</span></header><h1>Класичний квіз</h1><div id="notice" hidden role="status"></div>
<form id="joinForm" class="panel"><label>Код кімнати <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" required></label><label>Назва команди <input id="name" maxlength="40" autocomplete="off" required></label><p class="muted">Входьте з одного пристрою капітана. Відповідь надсилається один раз від усієї команди.</p><button id="join" type="submit" class="wide">Увійти</button></form>
<section id="session" hidden><div class="panel row spread"><div><h2 id="teamName"></h2><small id="phase"></small></div><div data-clock class="clock">60</div></div>
<section id="question" class="panel" hidden><p id="questionNumber" class="muted"></p><h2 id="questionText" class="question-text"></h2><div id="media" class="media"></div><p id="revealedAnswer" class="answer" hidden></p></section>
<form id="answerForm" class="panel" hidden><label for="answer">Відповідь команди</label><textarea id="answer" maxlength="1000" required placeholder="Обговоріть відповідь і надішліть її до завершення часу"></textarea><button id="send" type="submit" class="wide">Надіслати відповідь</button><p id="answerStatus" class="muted" aria-live="polite"></p></form>
<section class="panel"><h2 id="teamsTitle">Команди</h2><div id="teams"></div></section></section><button id="allowSound" class="secondary" hidden>Дозволити звук</button></main></body></html>
