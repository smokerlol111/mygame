<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBS Screen — Своя гра</title><link rel="stylesheet" href="/style.css?v=168"><script src="/socket.io/socket.io.js"></script><script src="/common.js?v=168"></script>
<style>
/* v1.5.10 — larger question text for the stream/OBS view */
#app .question{
  font-size:clamp(30px,3.25vw,52px);
  line-height:1.18;
  font-weight:800;
  max-width:1120px;
  margin-left:auto;
  margin-right:auto;
}
</style>

<style>
.imageRevealWrap{max-width:980px;margin:16px auto;text-align:center}
.imageRevealFrame{overflow:hidden;border-radius:18px;border:2px solid rgba(255,255,255,.18);background:#090514;box-shadow:0 16px 50px rgba(0,0,0,.42)}
.imageRevealImg{display:block;width:100%;max-height:58vh;object-fit:contain;transition:filter .65s ease,transform .65s ease}
.imageRevealValue{display:inline-block;margin:0 0 12px;padding:8px 18px;border-radius:999px;font-weight:900;font-size:clamp(24px,3vw,42px);background:rgba(255,196,0,.14);border:1px solid rgba(255,215,70,.45)}
</style>
<style>
/* v1.6.8 — permanent OBS camera-safe area */
body.screen .wrap{max-width:none;padding-left:340px;padding-right:24px;box-sizing:border-box}
.cameraSafe{position:fixed;left:18px;top:18px;width:292px;aspect-ratio:16/9;border:2px dashed rgba(255,255,255,.22);border-radius:18px;background:rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.12em;color:rgba(255,255,255,.28);z-index:0}
.imageRevealWrap{max-width:1180px;margin:8px auto}.imageRevealImg{width:100%;height:auto;max-height:64vh;object-fit:contain}.imageRevealFrame{display:flex;align-items:center;justify-content:center}
.audQr{width:min(300px,24vw);background:white;padding:10px;border-radius:18px}.audGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:1000px;margin:18px auto}.audOpt{padding:16px;border-radius:14px;background:rgba(255,255,255,.08);font-size:24px;font-weight:800}
@media(max-width:1200px){body.screen .wrap{padding-left:300px}.cameraSafe{width:250px}}
</style>
</head><body class="screen"><div class="cameraSafe">КАМЕРА 16:9</div><div class="wrap"><div id="app"><div class="panel center"><h2>Підключення до кімнати…</h2></div></div></div><script>
const socket=io(),app=document.getElementById('app');
let cueAudioCtx=null;
const cueAudio={
 question:new Audio('/sounds/question.mp3'),
 buzz_open:new Audio('/sounds/buzz.mp3')
};
Object.values(cueAudio).forEach(a=>{a.preload='auto';});
function playCueSound(type){
 const key=type==='gong'?'question':type;
 const a=cueAudio[key];
 if(!a)return;
 try{
  a.pause();
  a.currentTime=0;
  const p=a.play();
  if(p&&p.catch)p.catch(()=>{});
 }catch(e){}
}
socket.on('cue',e=>playCueSound(e?.type));
let data=null,state=null,loadedGameId='';

let firstTurnClockHandle=null;
function armFirstTurnClock(){
  if(firstTurnClockHandle){clearInterval(firstTurnClockHandle);firstTurnClockHandle=null}
  const el=document.getElementById('firstTurnTimer');
  const end=Number(state?.firstTurnQuiz?.endsAt||0);
  if(!el||!end||state?.firstTurnQuiz?.timerStatus!=='running')return;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    el.textContent=String(left);
    if(left<=0&&firstTurnClockHandle){clearInterval(firstTurnClockHandle);firstTurnClockHandle=null}
  };
  tick();
  firstTurnClockHandle=setInterval(tick,200);
}
let code=location.pathname.split('/').filter(Boolean)[1]||new URLSearchParams(location.search).get('code')||'';
async function ensureGameData(gameId){if(!gameId||gameId===loadedGameId)return;const r=await fetch(`/games/${encodeURIComponent(gameId)}.json`,{cache:'no-store'});if(!r.ok)throw new Error('Game HTTP '+r.status);data=await r.json();loadedGameId=gameId}
function setObsNet(ok){const el=document.getElementById('obsNet');if(el){el.textContent=ok?'🟢 LIVE':'🔴 OFFLINE';el.style.opacity=ok?'.45':'1'}}
function joinObs(){if(!code)return;socket.emit('joinScreen',{code},r=>{if(!r?.ok)app.innerHTML=`<div class="panel center"><h2>${r?.error||'Кімнату не знайдено.'}</h2></div>`})}
if(code)joinObs();else app.innerHTML=`<div class="panel center"><h2>Вкажіть кімнату</h2><p>Використайте адресу <b>/screen/КОД</b></p></div>`;
socket.on('connect',()=>{setObsNet(true);joinObs()});
socket.on('disconnect',()=>setObsNet(false));
socket.on('roomClosed',({code:closedCode})=>{
 if(closedCode!==code)return;
 const last=state; state=null; const rs=last?.finalResults||[]; const w=rs[0];
 app.innerHTML=`<div class="panel center" style="margin-top:3vh"><div class="huge">🏁</div><h1 style="font-size:52px">ГРУ ЗАВЕРШЕНО</h1>${w?`<h2>🏆 ПЕРЕМОЖЕЦЬ</h2><div class="winner" style="font-size:72px">${GameUI.esc(w.name)}</div><div class="huge">${w.score}</div><div class="finalList">${rs.map((x,i)=>`<div class="finalItem"><span><b>${i+1}. ${GameUI.esc(x.name)}</b></span><b>${x.score}</b></div>`).join('')}</div>`:''}</div>`;
});

socket.on('state',async s=>{if(code&&s.code!==code)return;state=s;code=s.code;try{await ensureGameData(s.gameId);render()}catch(e){console.error(e);app.innerHTML='<div class="panel center"><h2>Помилка завантаження гри</h2></div>'}});
socket.on('firstTurnProgress',x=>{if(!state||x.code!==code||state.phase!=='first_turn_quiz')return;state.firstTurnQuiz.submittedPlayerIds=x.submittedPlayerIds||[];render()});

function imageRevealHTML(cur,host=false){
 if(!cur||cur.questionType!=='imageReveal')return '';
 const stage=Number(cur.revealStage||0), last=(cur.revealValues?.length||5)-1;
 const single=last===0; const blur=single?0:([28,20,13,7,0][Math.min(stage,4)] ?? 0);
 const scale=single?1:([1.12,1.09,1.06,1.03,1][Math.min(stage,4)] ?? 1);
 return `<div class="imageRevealWrap">
   <div class="imageRevealValue">${cur.value} БАЛІВ</div>
   <div class="imageRevealFrame"><img src="${GameUI.esc(cur.image||'')}" class="imageRevealImg" style="filter:blur(${blur}px);transform:scale(${scale})"></div>
   ${single?'':`<div class="muted center">Відкриття ${stage+1}/${last+1}</div>`}
   ${host&&stage<last?'<div class="row" style="justify-content:center;margin-top:12px"><button class="btn gold" id="revealImageStep">👁 ВІДКРИТИ ЩЕ → '+GameUI.esc(String(cur.revealValues[stage+1]))+' БАЛІВ</button></div>':''}
 </div>`;
}
let audienceClockHandle=null;
function armAudienceClock(){if(audienceClockHandle){clearInterval(audienceClockHandle);audienceClockHandle=null}const el=document.getElementById('audienceTimer'),end=Number(state?.audience?.endsAt||0);if(!el||!end)return;const tick=()=>{const left=Math.max(0,(end-Date.now())/1000);el.textContent=left.toFixed(1);if(left<=0){clearInterval(audienceClockHandle);audienceClockHandle=null}};tick();audienceClockHandle=setInterval(tick,100)}
let numericClockHandle=null;
function armNumericClock(){if(numericClockHandle){clearInterval(numericClockHandle);numericClockHandle=null}const el=document.getElementById('numericTimer'),end=Number(state?.numericChallenge?.endsAt||0);if(!el||!end)return;const tick=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=left;if(left<=0){clearInterval(numericClockHandle);numericClockHandle=null}};tick();numericClockHandle=setInterval(tick,200)}
function render(){if(!state||!data)return;let h=``;
 if(state.phase==='paused'){
   app.innerHTML=`<div class="panel center" style="margin-top:8vh;padding:56px"><div class="huge">⏸</div><h1 style="font-size:54px">ТЕХНІЧНА ПАУЗА</h1><p class="muted" style="font-size:24px">Скоро продовжимо</p></div>`;
   return;
 }

 if(state.phase==='lobby')h+=`<div class="panel center"><div class="roomCode">${state.code}</div><h2>Приєднуйтесь з телефону</h2></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='first_turn_quiz'){
   const q=state.firstTurnQuiz||{}, submitted=q.submittedPlayerIds||[], status=q.timerStatus||'ready';
   const timer=status==='running'?`<div class="huge"><span id="firstTurnTimer">30</span></div>`:status==='expired'?'<div class="huge">0</div><h2>⏱ ЧАС ВИЙШОВ</h2>':'<div class="huge">30</div><p class="muted">Таймер ще не запущено</p>';
   h+=`<div class="panel center"><div class="huge">🎯</div><h1>РОЗІГРАШ ПЕРШОГО ХОДУ</h1><div class="question">${GameUI.esc(q.question||'')}</div>${timer}<p class="muted">Хто буде найближчим до правильної відповіді?</p>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:14px auto 0;max-width:760px;text-align:left">
   ${state.players.map(p=>{const done=submitted.includes(p.id);const label=done?'✅ Відповів':status==='expired'?'❌ Немає відповіді':'⏳ Думає';return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border:1px solid #3a2b60;border-radius:12px;background:rgba(255,255,255,.025);font-size:17px"><b>${GameUI.esc(p.name)}</b><span>${label}</span></div>`}).join('')}
   </div></div>`}
 else if(state.phase==='first_turn_result'){
   const q=state.firstTurnQuiz, results=q.results||[], revealCount=q.revealCount||0;
   const revealed=results.slice(Math.max(0,results.length-revealCount)).reverse();
   h+=`<div class="panel center"><div class="huge">${q.correctAnswer}</div><h2>ПРАВИЛЬНА ВІДПОВІДЬ</h2><p class="muted">${GameUI.esc(q.unit||'')}</p>
   <div class="finalList" style="margin-top:22px">${revealed.map(r=>{
      const place=results.findIndex(x=>x.id===r.id)+1;
      return `<div class="finalItem" style="padding:14px 20px;min-height:58px"><span class="winner" style="font-size:28px">${place===1?'🥇 ':''}${place}. ${GameUI.esc(r.name)}</span><span style="font-size:21px;line-height:1.25">${r.noAnswer?'<b>— НЕМАЄ ВІДПОВІДІ</b>':`Відповідь: <b style="font-size:25px">${r.answer}</b> &nbsp; • &nbsp; Різниця: <b style="font-size:25px">${r.diff}</b>`}</span></div>`;
   }).join('')}</div>
   ${revealCount===0?'<p class="muted" style="margin-top:24px">Готуємо результати…</p>':''}
   </div>`}
 else if(state.phase==='numeric_ready'){const n=state.numericChallenge||{};h+=`<div class="panel center"><div class="huge">🔢 30</div><h1>ЧИСЛОВЕ ПИТАННЯ • ${n.value} БАЛІВ</h1><div class="question">${GameUI.esc(n.question||'')}</div><h2>⏳ ЧЕКАЄМО СТАРТУ ВЕДУЧОГО</h2></div>`}
 else if(state.phase==='numeric_question'){const n=state.numericChallenge||{},sub=n.submittedPlayerIds||[],left=n.endsAt?Math.max(0,Math.ceil((n.endsAt-Date.now())/1000)):0;h+=`<div class="panel center"><div class="huge">🔢 <span id="numericTimer">${left}</span></div><h1>ЧИСЛОВЕ ПИТАННЯ • ${n.value} БАЛІВ</h1><div class="question">${GameUI.esc(n.question||'')}</div><div class="finalList">${state.players.map(p=>`<div class="finalItem"><span>${GameUI.esc(p.name)}</span><b>${sub.includes(p.id)?'✅ Відповів':'⏳ Думає'}</b></div>`).join('')}</div></div>`}
 else if(state.phase==='numeric_result'){const n=state.numericChallenge||{},rs=n.results||[],rev=n.revealCount||0,revealed=rs.slice(Math.max(0,rs.length-rev)).reverse();h+=`<div class="panel center"><div class="huge">${n.correctAnswer}</div><h2>ПРАВИЛЬНА ВІДПОВІДЬ</h2><div class="finalList">${revealed.map(r=>{const place=rs.findIndex(x=>x.id===r.id)+1;return `<div class="finalItem"><span class="winner">${place===1?'🥇 ':''}${place}. ${GameUI.esc(r.name)}</span><span>${r.noAnswer?'— НЕМАЄ ВІДПОВІДІ':`Відповідь: <b>${r.answer}</b> • різниця: <b>${r.diff}</b>${place===1?' • +'+n.value:''}`}</span></div>`}).join('')}</div></div>`}
 else if(state.phase==='board'){let chooser=state.players.find(p=>p.id===state.turnPlayerId);h+=`<div class="center" style="margin:8px 0 22px;font-size:30px;line-height:1.2;font-weight:700">🎯 Питання обирає: <b style="font-size:36px">${GameUI.esc(chooser?.name||'—')}</b></div>${GameUI.boardHTML(data,state,false)}${GameUI.playersHTML(state.players)}`;}
 else if(state.phase==='audience_lobby'){const a=state.audience||{};h+=`<div class="panel center"><div style="font-size:26px;font-weight:900;letter-spacing:.15em">👥 ГРАЮТЬ ГЛЯДАЧІ</div><h1 style="font-size:52px">${GameUI.esc(a.title||'')}</h1><img class="audQr" src="/audience-qr/${state.code}"><h2>Скануй QR • введи нік • забирай приз</h2><p style="font-size:24px">У грі: <b>${a.joined||0}</b></p></div>`}
 else if(state.phase==='audience_question'){const a=state.audience||{},left=a.endsAt?Math.max(0,Math.ceil((a.endsAt-Date.now())/1000)):0;h+=`<div class="panel center"><div class="huge" id="audienceTimer">${left}.0</div><h2>ГЛЯДАЧІ • ПИТАННЯ ${a.questionIndex+1}/${a.totalQuestions}</h2><div class="question">${GameUI.esc(a.question||'')}</div><div class="audGrid">${(a.options||[]).map((o,i)=>`<div class="audOpt">${'ABCD'[i]} • ${GameUI.esc(o)}</div>`).join('')}</div><p style="font-size:22px">Відповіли: <b>${a.submitted||0}/${a.joined||0}</b></p></div>`}
 else if(state.phase==='audience_result'){const a=state.audience||{},total=Math.max(1,a.submitted||0);h+=`<div class="panel center"><h2>ПРАВИЛЬНА ВІДПОВІДЬ</h2><div class="huge">${'ABCD'[a.correct]} • ${GameUI.esc(a.options?.[a.correct]||'')}</div><div class="audGrid">${(a.options||[]).map((o,i)=>`<div class="audOpt" style="${i===a.correct?'border:2px solid rgba(100,255,160,.8)':''}">${'ABCD'[i]} • ${GameUI.esc(o)} — <b>${Math.round((a.counts?.[i]||0)*100/total)}%</b></div>`).join('')}</div><p style="font-size:22px">${GameUI.esc(a.fact||'')}</p></div>`}
 else if(state.phase==='audience_podium'){const a=state.audience||{},rs=(a.ranking||[]).slice(0,5),rev=a.revealCount||0,n=Math.min(5,rs.length),shown=rs.slice(Math.max(0,n-rev),n).reverse(),latest=shown[shown.length-1];h+=`<div class="panel center"><h1>🏆 ${GameUI.esc(a.title||'')}</h1>${latest?`<div style="font-size:34px;font-weight:900">${rs.indexOf(latest)+1===1?'🥇 ПЕРЕМОЖЕЦЬ':(rs.indexOf(latest)+1)+' МІСЦЕ'}</div><div class="winner" style="font-size:72px">${GameUI.esc(latest.name)}</div><div style="font-size:28px">${latest.correct}/3 правильних • ${(latest.timeMs/1000).toFixed(2)} с</div>`:'<div class="huge">ТОП-5</div>'}${shown.length>1?`<div class="finalList">${shown.slice(0,-1).map(r=>`<div class="finalItem"><span>${GameUI.esc(r.name)}</span><b>${r.correct}/3 • ${(r.timeMs/1000).toFixed(2)} с</b></div>`).join('')}</div>`:''}</div>`}
 else if(['question','buzz','answering','cat_question','result'].includes(state.phase)){let label=state.current?.type==='cat'?'🐈 КІТ У МІШКУ':'';h+=`<div class="panel"><div class="center"><b>${label}</b></div><div class="question">${GameUI.esc(state.current?.q||'')}</div>${imageRevealHTML(state.current,false)}${state.phase==='answering'?`<div class="center"><h2>Відповідає: ${GameUI.esc(state.players.find(p=>p.id===state.buzzer)?.name||'')}</h2></div>`:''}${state.phase==='result'&&state.revealAnswer?`<div class="answer"><b>Відповідь:</b> ${GameUI.esc(state.current?.a||'')}</div>`:''}</div>${GameUI.playersHTML(state.players,state.buzzer)}`}
 else if(state.phase==='va_bank_bet')h+=`<div class="panel center"><div class="huge">🎰</div><h1>ВА-БАНК!</h1><p>Гравець робить ставку</p></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='va_bank_question')h+=`<div class="panel center"><div class="huge">🎰 ВА-БАНК</div><h2>Ставка: ${state.vaBankBet}</h2><div class="question">${GameUI.esc(state.current?.q||'')}</div></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='duel_choose')h+=`<div class="panel center"><div class="huge">⚔️</div><h1>ДУЕЛЬ!</h1><p>Гравець обирає суперника</p></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='duel_question')h+=`<div class="panel center"><div class="huge">⚔️ ДУЕЛЬ</div><div class="question">${GameUI.esc(state.current?.q||'')}</div></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='cat_choose')h+=`<div class="panel center"><div class="huge">🐈</div><h1>КІТ У МІШКУ</h1><p>Ведучий обирає гравця</p></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_bets')h+=`<div class="panel center"><div class="huge">ФІНАЛ</div><h2>Таємні ставки</h2></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_ready')h+=`<div class="panel"><div class="center"><div class="huge">ФІНАЛ</div><p class="muted">Таймер ще не запущено</p></div><div class="question">${GameUI.esc(state.current?.q||'')}</div></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_question')h+=`<div class="panel"><div class="center"><div class="huge">${state.finalSeconds}</div></div><div class="question">${GameUI.esc(state.current?.q||'')}</div></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_review')h+=`<div class="panel center"><h1>Фінал завершено</h1><p>Ведучий перевіряє відповіді</p></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_result'){
   const total=state.finalResults?.length||0, shown=Math.min(state.finalRevealCount||0,total), revealed=[];
   for(let n=0;n<shown;n++){const idx=total-1-n;if(idx>=0)revealed.push({p:state.finalResults[idx],place:idx+1});}
   const latest=revealed[revealed.length-1];
   h+=`<div class="panel center"><div style="font-size:24px;letter-spacing:.18em;font-weight:800;opacity:.8">SMOKERLOL • ФІНАЛ</div>${!latest?`<div class="huge" style="margin-top:34px">🏆</div><h1 style="font-size:54px">ФІНАЛЬНІ РЕЗУЛЬТАТИ</h1><p class="muted" style="font-size:24px">Готуємо церемонію нагородження…</p>`:`<div style="margin-top:26px;font-size:34px;font-weight:900">${latest.place===1?'🏆 ПЕРЕМОЖЕЦЬ':latest.place+' МІСЦЕ'}</div><div class="winner" style="font-size:clamp(52px,7vw,92px);line-height:1.05;margin:12px 0 20px">${GameUI.esc(latest.p.name)}</div><div style="font-size:23px;opacity:.8">Фінальна відповідь</div><div class="answer" style="font-size:clamp(28px,3vw,44px);margin:10px auto;max-width:1000px">${GameUI.esc(latest.p.finalAnswer||'—')} ${latest.p.correct?'✅':'❌'}</div><div style="font-size:25px;margin-top:18px">${latest.p.beforeScore} ${latest.p.correct?'+':'−'} ${latest.p.bet} =</div><div class="huge" style="font-size:clamp(64px,8vw,110px);margin-top:4px">${latest.p.score}</div><div class="muted" style="font-size:22px">БАЛІВ</div>`}${revealed.length>1?`<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px">${revealed.slice(0,-1).map(x=>`<div style="padding:10px 18px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(0,0,0,.18);font-size:19px"><b>${x.place}.</b> ${GameUI.esc(x.p.name)} — <b>${x.p.score}</b></div>`).join('')}</div>`:''}</div>`;
 }
 app.innerHTML=h;armFirstTurnClock();armNumericClock();armAudienceClock()}
</script></body></html>
