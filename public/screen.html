<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBS Screen — Своя гра</title><link rel="stylesheet" href="/style.css?v=144"><script src="/socket.io/socket.io.js"></script><script src="/common.js?v=144"></script></head><body class="screen"><div class="wrap"><div id="app"><div class="panel center"><h2>Підключення до кімнати…</h2></div></div></div><script>
const socket=io(),app=document.getElementById('app');let data=null,state=null,loadedGameId='';

let firstTurnClockHandle=null;
function armFirstTurnClock(){
  if(firstTurnClockHandle){clearInterval(firstTurnClockHandle);firstTurnClockHandle=null}
  const el=document.getElementById('firstTurnTimer');
  const end=Number(state?.firstTurnQuiz?.endsAt||0);
  if(!el||!end||state?.firstTurnQuiz?.timerStatus!=='running')return;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    el.textContent=String(left);
    if(left<=0&&firstTurnClockHandle){clearInterval(firstTurnClockHandle);firstTurnClockHandle=null}
  };
  tick();
  firstTurnClockHandle=setInterval(tick,200);
}
let code=location.pathname.split('/').filter(Boolean)[1]||new URLSearchParams(location.search).get('code')||'';
async function ensureGameData(gameId){if(!gameId||gameId===loadedGameId)return;const r=await fetch(`/games/${encodeURIComponent(gameId)}.json`,{cache:'no-store'});if(!r.ok)throw new Error('Game HTTP '+r.status);data=await r.json();loadedGameId=gameId}
if(code)socket.emit('joinScreen',{code},r=>{if(!r.ok)app.innerHTML=`<div class="panel center"><h2>${r.error}</h2></div>`});else app.innerHTML=`<div class="panel center"><h2>Вкажіть кімнату</h2><p>Використайте адресу <b>/screen/КОД</b></p></div>`;
socket.on('state',async s=>{if(code&&s.code!==code)return;state=s;code=s.code;try{await ensureGameData(s.gameId);render()}catch(e){console.error(e);app.innerHTML='<div class="panel center"><h2>Помилка завантаження гри</h2></div>'}});
socket.on('firstTurnProgress',x=>{if(!state||x.code!==code||state.phase!=='first_turn_quiz')return;state.firstTurnQuiz.submittedPlayerIds=x.submittedPlayerIds||[];render()});
function render(){if(!state||!data)return;let h=`<div class="top"><div><div class="brand">SMOKERLOL</div><h1>${GameUI.esc(data.title)}</h1></div><div class="badge">Кімната ${state.code}</div></div>`;
 if(state.phase==='lobby')h+=`<div class="panel center"><div class="roomCode">${state.code}</div><h2>Приєднуйтесь з телефону</h2></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='first_turn_quiz'){
   const q=state.firstTurnQuiz||{}, submitted=q.submittedPlayerIds||[], status=q.timerStatus||'ready';
   const timer=status==='running'?`<div class="huge"><span id="firstTurnTimer">30</span></div>`:status==='expired'?'<div class="huge">0</div><h2>⏱ ЧАС ВИЙШОВ</h2>':'<div class="huge">30</div><p class="muted">Таймер ще не запущено</p>';
   h+=`<div class="panel center"><div class="huge">🎯</div><h1>РОЗІГРАШ ПЕРШОГО ХОДУ</h1><div class="question">${GameUI.esc(q.question||'')}</div>${timer}<p class="muted">Хто буде найближчим до правильної відповіді?</p></div><div class="finalList">${state.players.map(p=>`<div class="finalItem"><span>${GameUI.esc(p.name)}</span><b>${submitted.includes(p.id)?'✅':status==='expired'?'❌':'⏳'}</b></div>`).join('')}</div>`}
 else if(state.phase==='first_turn_result'){const q=state.firstTurnQuiz;h+=`<div class="panel center"><div class="huge">${q.correctAnswer}</div><h2>ПРАВИЛЬНА ВІДПОВІДЬ</h2><p class="muted">${GameUI.esc(q.unit||'')}</p><div class="finalList">${(q.results||[]).map((r,i)=>`<div class="finalItem"><span class="winner">${i+1}. ${GameUI.esc(r.name)}</span><span>${r.noAnswer?'<b>—</b> <span class="muted">немає відповіді</span>':`<b>${r.answer}</b> <span class="muted">(${r.delta>0?'+':''}${r.delta})</span>`}</span></div>`).join('')}</div></div>`}
 else if(state.phase==='board'){let chooser=state.players.find(p=>p.id===state.turnPlayerId);h+=`<div class="center muted" style="margin-bottom:12px">🎯 Питання обирає: <b>${GameUI.esc(chooser?.name||'—')}</b></div>${GameUI.boardHTML(data,state,false)}${GameUI.playersHTML(state.players)}`;}
 else if(['question','buzz','answering','cat_question','result'].includes(state.phase)){let label=state.current?.type==='cat'?'🐈 КІТ У МІШКУ':'';h+=`<div class="panel"><div class="center"><b>${label}</b></div><div class="question">${GameUI.esc(state.current?.q||'')}</div>${state.phase==='answering'?`<div class="center"><h2>Відповідає: ${GameUI.esc(state.players.find(p=>p.id===state.buzzer)?.name||'')}</h2></div>`:''}${state.phase==='result'&&state.revealAnswer?`<div class="answer"><b>Відповідь:</b> ${GameUI.esc(state.current?.a||'')}</div>`:''}</div>${GameUI.playersHTML(state.players,state.buzzer)}`}
 else if(state.phase==='va_bank_bet')h+=`<div class="panel center"><div class="huge">🎰</div><h1>ВА-БАНК!</h1><p>Гравець робить ставку</p></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='va_bank_question')h+=`<div class="panel center"><div class="huge">🎰 ВА-БАНК</div><h2>Ставка: ${state.vaBankBet}</h2><div class="question">${GameUI.esc(state.current?.q||'')}</div></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='duel_choose')h+=`<div class="panel center"><div class="huge">⚔️</div><h1>ДУЕЛЬ!</h1><p>Гравець обирає суперника</p></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='duel_question')h+=`<div class="panel center"><div class="huge">⚔️ ДУЕЛЬ</div><div class="question">${GameUI.esc(state.current?.q||'')}</div></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='cat_choose')h+=`<div class="panel center"><div class="huge">🐈</div><h1>КІТ У МІШКУ</h1><p>Ведучий обирає гравця</p></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_bets')h+=`<div class="panel center"><div class="huge">ФІНАЛ</div><h2>Таємні ставки</h2></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_ready')h+=`<div class="panel"><div class="center"><div class="huge">ФІНАЛ</div><p class="muted">Таймер ще не запущено</p></div><div class="question">${GameUI.esc(state.current?.q||'')}</div></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_question')h+=`<div class="panel"><div class="center"><div class="huge">${state.finalSeconds}</div></div><div class="question">${GameUI.esc(state.current?.q||'')}</div></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_review')h+=`<div class="panel center"><h1>Фінал завершено</h1><p>Ведучий перевіряє відповіді</p></div>${GameUI.playersHTML(state.players)}`;
 else if(state.phase==='final_result')h+=`<div class="panel center"><h1>🏆 ФІНАЛЬНИЙ РЕЗУЛЬТАТ</h1>${state.finalResults.map((p,i)=>`<div class="finalItem"><span class="winner">${i+1}. ${GameUI.esc(p.name)}</span><span class="winner">${p.score}</span></div>`).join('')}</div>`;
 app.innerHTML=h;armFirstTurnClock()}
</script></body></html>
