    <style>

      }

        font-size: clamp(22px, 2.5vw, 38px);

    <style>
      .imageRevealWrap {
        width: min(100%, 620px);
        max-width: 620px;
        margin: 12px auto;
        text-align: center;
      }
      .imageRevealFrame {
        overflow: hidden;
        border-radius: 18px;
        border: 2px solid rgba(255, 255, 255, 0.18);
        background: #090514;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.42);
      }
      .imageRevealImg {

        display: inline-block;
        margin: 0 0 12px;
        padding: 8px 18px;
        border-radius: 999px;
        font-weight: 900;
        font-size: clamp(24px, 3vw, 42px);
        background: rgba(255, 196, 0, 0.14);
        border: 1px solid rgba(255, 215, 70, 0.45);
      }
      .emojiQuestion {
        font-size: clamp(64px, 8vw, 118px);
        line-height: 1.2;
        text-align: center;
        letter-spacing: 0.14em;
        padding: 8px 10px;
        white-space: normal;
      }
    </style>
    <style>
      /* v1.6.9 — permanent OBS camera-safe area */
      body.screen .wrap {
        max-width: none;
        padding-left: 340px;
        padding-right: 24px;
        box-sizing: border-box;
      }
      .cameraSafe {
        position: fixed;
        left: 18px;
        top: 18px;
        width: 292px;
        aspect-ratio: 16/9;
        border: 2px dashed rgba(255, 255, 255, 0.22);
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.28);
        z-index: 0;
      }
      .imageRevealWrap {
        max-width: 1180px;
        margin: 8px auto;
      }
      .imageRevealImg {
        width: 100%;
        height: auto;
        max-height: 64vh;
        object-fit: contain;
      }
      .imageRevealFrame {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .audQr {
        width: min(300px, 24vw);
        background: white;
        padding: 10px;
        border-radius: 18px;
      }
      .audGrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        max-width: 1000px;
        margin: 18px auto;
      }
      .audOpt {
        padding: 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 24px;
        font-weight: 800;
      }
      @media (max-width: 1200px) {
        body.screen .wrap {
          padding-left: 300px;
        }
        .cameraSafe {
          width: 250px;
        }
      }
    </style>
    <style>
      /* v3.1 Active Speaker: highlight the EXISTING score cards, no separate overlay. */
      #app .scorebar .player.voice-speaking {
        border-color: #a78bfa !important;
        outline: 3px solid #a78bfa !important;
        outline-offset: -3px !important;
        background: rgba(124, 58, 237, 0.35) !important;
        box-shadow:
          0 0 0 3px rgba(167, 139, 250, 0.22),
          0 0 28px rgba(167, 139, 250, 0.65) !important;
        transform: none !important;
        transition:
          background 0.12s,
          outline-color 0.12s,
          box-shadow 0.12s;
      }
      /* OBS v3 test layout: fixed camera block + four right-side gameplay segments. */
      body.screen {
        overflow: hidden;
      }
      body.screen .wrap {
        position: fixed;
        left: 340px;
        right: 24px;
        top: 0;
        bottom: 0;
        padding: 12px 0 !important;
        max-width: none;
        box-sizing: border-box;
      }
      .cameraSafe {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        bottom: 0 !important;
        width: 316px !important;
        height: 100vh !important;
        aspect-ratio: auto !important;
        border-radius: 0 !important;
        box-sizing: border-box;
      }
      #app {
        height: 100%;
      }
      .obsGameLayout {
        height: 100%;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto 92px 112px;
        gap: 8px;
        min-height: 0;
      }
      .obsSegment {
        min-width: 0;
        min-height: 0;
        box-sizing: border-box;
        border-radius: 14px;
      }
      .obsSegmentQuestion {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .obsSegmentQuestion .question {
        margin: 0 !important;
        width: 100%;
        box-sizing: border-box;
      }
      .obsSegmentMedia {
        display: flex;
        align-items: center;
        justify-content: center;
        max-height: 50vh;
        overflow: visible;
      }
      .obsSegmentMedia:empty {
        display: none;
      }
      .obsSegmentMedia .media-question {
        margin: 0 auto !important;
        width: 100%;
        height: auto !important;
        box-sizing: border-box;
      }
      .obsSegmentMedia .media-question audio {
        display: block;
        width: 100% !important;
        height: 54px !important;
      }
      .obsSegmentMedia .imageRevealWrap {
        margin: 0 auto !important;
        width: 100%;
        height: auto !important;
        max-height: 50vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
      }
      .obsSegmentMedia .imageRevealFrame {
        width: 100%;
        height: min(38vh, 420px) !important;
        max-height: calc(50vh - 42px);
        overflow: hidden !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .obsSegmentMedia .imageRevealFrame .imageRevealImg {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain !important;
        object-position: center center !important;
        transform: none !important;
      }
      .obsSegmentMedia .quizMedia,
      .obsSegmentMedia .imageRevealImg,
      .obsSegmentMedia img {
        display: block;
        width: auto !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: calc(50vh - 42px) !important;
        object-fit: contain !important;
        object-position: center center !important;
        transform-origin: center center !important;
        margin: auto;
      }
      .obsSegmentMedia .imageRevealImg {
        transform: none !important;
      }
      .obsSegmentAnswer {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 6px 12px;
      }
      .obsSegmentAnswer.is-empty {
        visibility: hidden !important;
        border: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .obsSegmentAnswer .answer {
        margin: 0 !important;
        width: 100%;
        text-align: center;
      }
      .obsSegmentPlayers {
        display: flex;
        align-items: stretch;
        overflow: hidden;
      }
      .obsSegmentPlayers .scorebar {
        width: 100%;
        height: 100%;
        margin: 0 !important;
        align-items: stretch;
      }
      .obsSegmentPlayers .scorebar .player {
        display: flex;
        flex-direction: column;
        justify-content: center;
        box-sizing: border-box;
      }
      .obsSegmentPlayers .scorebar .player.active {
        outline: none !important;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035) !important;
      }
      #app .scorebar .player.active,
      #app .scorebar .player.active.voice-speaking {
        background: linear-gradient(150deg, #665027, #453618) !important;
        border-color: #e4bd59 !important;
        color: #fff !important;
        box-shadow:
          inset 0 0 24px rgba(242, 192, 73, 0.15),
          0 0 22px rgba(232, 182, 69, 0.32) !important;
      }
      #app .scorebar .player.active b,
      #app .scorebar .player.active .score,
      #app .scorebar .player.active .muted {
        color: #fff !important;
        text-shadow: none !important;
      }
      @media (max-width: 1200px) {
        body.screen .wrap {
          left: 300px;
        }
        .cameraSafe {
          width: 276px !important;
        }
      }

      /* UI-03: Duo VS inside the established OBS four-part layout. */
      .duelStage {
        width: 100%;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(5px, 0.9vh, 10px);
        margin: 0 auto;
      }
      .duelHeading {
        color: #ffd86b;
        font-weight: 900;
        font-size: clamp(19px, 2.4vw, 33px);
        letter-spacing: 0.14em;
        line-height: 1.05;
        text-shadow: 0 0 20px rgba(255, 208, 93, 0.3);
      }
      .duelMatchup {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: clamp(6px, 1.3vw, 18px);
        width: min(100%, 850px);
        margin: 0 auto;
      }
      .duelFighter {
        min-width: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-height: clamp(72px, 10vh, 112px);
        padding: clamp(7px, 1.2vh, 14px);
        border: 2px solid #795aa7;
        border-radius: 14px;
        background: linear-gradient(150deg, #332247, #251936);
        color: #fff;
        text-align: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        transition:
          background 0.2s,
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .duelFighter-role {
        font-size: clamp(11px, 0.95vw, 15px);
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #e4c8ff;
      }
      .duelFighter-name {
        width: 100%;
        font-size: clamp(17px, 1.85vw, 27px);
        line-height: 1.12;
        font-weight: 900;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #fff;
      }
      .duelFighter-score {
        font-size: clamp(18px, 2vw, 27px);
        font-weight: 900;
        line-height: 1.06;
        color: #fff;
      }
      .duelVersus {
        font-size: clamp(24px, 3vw, 44px);
        font-weight: 1000;
        color: #ffd86b;
        line-height: 1;
        text-shadow: 0 0 20px rgba(255, 204, 80, 0.5);
      }
      .duelFighter.is-waiting {
        border-style: dashed;
        opacity: 0.8;
      }
      .duelFighter.is-answering {
        background: linear-gradient(150deg, #665027, #453618) !important;
        border-color: #e4bd59 !important;
        box-shadow:
          inset 0 0 24px rgba(242, 192, 73, 0.15),
          0 0 20px rgba(232, 182, 69, 0.35) !important;
      }
      .duelFighter.is-answering .duelFighter-role,
      .duelFighter.is-answering .duelFighter-name,
      .duelFighter.is-answering .duelFighter-score {
        color: #fff !important;
      }
      .duelFighter.voice-speaking {
        outline: 3px solid #ad8bff;
        outline-offset: 0;
        box-shadow: 0 0 25px rgba(167, 139, 250, 0.4);
      }
      .duelFighter.is-answering.voice-speaking {
        outline: 3px solid #ad8bff;
        outline-offset: 0;
      }
      .duelFighter.duelEntrance {
        animation: duelOpponentReveal 0.7s ease-out both;
      }
      @keyframes duelOpponentReveal {
        0% {
          opacity: 0;
          transform: translateX(15px) scale(0.92);
        }
        70% {
          opacity: 1;
          transform: translateX(-2px) scale(1.02);
        }
        100% {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .duelFighter.duelEntrance {
          animation: none !important;
        }
      }

      /* UI-04: show the chosen Cat in the Bag answerer above the question in OBS. */
      .catAnswererLabel {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: clamp(5px, 0.8vw, 12px);
        max-width: 100%;
        text-align: center;
        margin: clamp(3px, 0.7vh, 8px) auto 0;
        padding: clamp(6px, 0.8vh, 10px) clamp(12px, 1.6vw, 22px);
        border: 1px solid rgba(255, 215, 111, 0.56);
        border-radius: 12px;
        background: rgba(255, 204, 84, 0.12);
        color: #fff;
        font-size: clamp(18px, 1.8vw, 29px);
        line-height: 1.17;
        font-weight: 800;
      }
      .catAnswererLabel b {
        color: #fff;
        font-size: 1.12em;
        overflow-wrap: anywhere;
      }

      /* UI-05: compact VA-BANK speaker and wager in OBS without changing four segments. */
      .vaBankStage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(5px, 0.8vh, 10px);
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
      }
      .vaBankHeading {
        color: #ffd86b;
        font-size: clamp(22px, 2.3vw, 34px);
        font-weight: 900;
        letter-spacing: 0.1em;
        line-height: 1.12;
        text-shadow: 0 0 16px rgba(255, 210, 75, 0.24);
      }
      .vaBankInfo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: min(100%, 760px);
        max-width: 100%;
        box-sizing: border-box;
        padding: clamp(8px, 1vh, 12px) clamp(12px, 1.5vw, 22px);
        border: 1px solid rgba(255, 215, 111, 0.62);
        border-radius: 14px;
        background: linear-gradient(150deg, rgba(115, 83, 34, 0.55), rgba(67, 48, 23, 0.56));

      }
      .vaBankAnswerer {
        color: #fff;
        line-height: 1.2;
        font-size: clamp(18px, 1.8vw, 29px);
        font-weight: 800;
      }
      .vaBankAnswerer b {
        color: #fff;
        font-size: 1.08em;
      }
      .vaBankStake {
        color: #ffdc79;
        font-size: clamp(16px, 1.55vw, 24px);
        line-height: 1.2;
        font-weight: 900;
      }

      /* UI-06: Triplet three-challenge story in the existing OBS question segment. */
      .tripletStage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(5px, 0.8vh, 10px);
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0 auto;
      }
      .tripletTitle {
        color: #ffd275;
        font-weight: 900;
        letter-spacing: 0.07em;
        font-size: clamp(21px, 2.4vw, 34px);
        line-height: 1.1;
        text-align: center;
        text-shadow: 0 0 14px rgba(255, 197, 70, 0.3);
      }
      .tripletSubtitle {
        color: #d7c3ee;
        font-size: clamp(12px, 1.2vw, 18px);
        font-weight: 800;
        text-align: center;
      }
      .tripletSteps {
        display: grid;
        grid-template-columns: repeat(var(--triplet-count, 3), minmax(0, 1fr));
        gap: clamp(5px, 0.8vw, 12px);
        width: min(100%, 900px);
        min-width: 0;
      }
      .tripletStep {
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 3px;
        padding: clamp(6px, 0.9vh, 10px) 4px;
        min-height: clamp(72px, 10vh, 104px);
        border: 1px solid #61526f;
        border-radius: 12px;
        background: #292035;
        color: white;
        text-align: center;
        box-sizing: border-box;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .tripletStep.is-current {
        background: linear-gradient(150deg, #674b22, #3c2c1a);
        border: 2px solid #ffdb77;
        box-shadow: 0 0 18px rgba(255, 207, 93, 0.4);
        animation: tripletStageEnter 0.55s ease-out both;
      }
      .tripletStep.is-correct {
        background: linear-gradient(145deg, #284b37, #1f3328);
        border-color: #80d9a0;
      }
      .tripletStep.is-wrong {
        background: linear-gradient(145deg, #593039, #381f2c);
        border-color: #df8d97;
      }
      .tripletStep.is-final.is-current {
        animation: tripletLastGlow 1.8s ease-in-out infinite alternate;
      }
      .tripletStep-label {
        font-size: clamp(11px, 1.05vw, 15px);
        font-weight: 800;
        color: #fff;
      }
      .tripletStep-value {
        font-size: clamp(18px, 2vw, 28px);
        line-height: 1.05;
        font-weight: 900;
        color: #fff;
      }
      .tripletStep-status {
        font-size: clamp(11px, 1vw, 16px);
        font-weight: 900;
        color: #fff;
      }
      .tripletPlayer {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 10px;
        justify-content: center;
        align-items: center;
        width: min(100%, 760px);
        padding: clamp(6px, 0.8vh, 9px) 12px;
        background: rgba(112, 65, 145, 0.22);
        border: 1px solid rgba(177, 129, 224, 0.65);
        border-radius: 12px;
        box-sizing: border-box;
        font-size: clamp(15px, 1.45vw, 23px);
        line-height: 1.15;
      }
      .tripletPlayer span {
        font-size: 0.74em;
        color: #d7c3ee;
        font-weight: 800;
      }
      .tripletPlayer b {
        color: #fff;
        overflow-wrap: anywhere;
        min-width: 0;
      }
      .tripletNet {
        font-size: clamp(18px, 2vw, 29px);
        font-weight: 900;
        line-height: 1.1;
        color: #ffd275;
        text-align: center;
      }
      .tripletNet.negative {
        color: #ffacb4;
      }
      .tripletSummaryText {
        font-weight: 900;
        letter-spacing: 0.1em;
        font-size: clamp(16px, 1.7vw, 26px);
        color: #fff;
        text-align: center;
      }
      @keyframes tripletStageEnter {
        from {
          opacity: 0.55;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes tripletLastGlow {
        from {
          box-shadow: 0 0 10px rgba(255, 207, 93, 0.35);
        }
        to {
          box-shadow: 0 0 27px rgba(255, 207, 93, 0.82);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tripletStep.is-current,
        .tripletStep.is-final.is-current {
          animation: none !important;
        }
      }
    </style>
    <style>
      .seasonChampionStage {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .seasonChampionStage > * {
        position: relative;
        z-index: 2;
      }
      .seasonConfetti {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }
      .seasonConfetti i {
        position: absolute;
        top: -12vh;
        width: 10px;
        height: 22px;
        border-radius: 3px;
        background: hsl(var(--h), 90%, 60%);
        left: var(--x);
        animation: seasonConfettiFall var(--d) linear infinite;
        animation-delay: var(--delay);
        transform: rotate(var(--r));
      }
      .seasonConfetti .pop {
        top: auto;
        bottom: 4%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        animation: seasonPop 1.25s ease-out infinite;
        animation-delay: var(--delay);
      }
      .seasonCannon {
        position: absolute;
        bottom: 2%;
        font-size: clamp(52px, 6vw, 88px);
        z-index: 3;
        filter: drop-shadow(0 0 18px rgba(255, 210, 70, 0.45));
        animation: seasonCannonKick 1.25s ease-in-out infinite;
      }
      .seasonCannon.left {
        left: 2%;
        transform: rotate(25deg);
      }
      .seasonCannon.right {
        right: 2%;
        transform: scaleX(-1) rotate(25deg);
      }
      @keyframes seasonConfettiFall {
        0% {
          transform: translateY(-10vh) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        100% {
          transform: translateY(115vh) rotate(720deg);

        const pairKey = ids.length === 2 ? ids.join(":") : null;

        const answerer = GameUI.answererId(state),

      /* UI-05: present the actual VA-BANK answerer, including wager and result. */
      function vaBankHeaderHTML() {
        const player = state?.players?.find(p => p.id === state.vaBankPlayer);

        return (

      /* UI-06: only judged question values/results are sent by server; no answers or assumptions. */
      function tripletProgressHTML(t, name) {
        const total = Math.max(1, Math.floor(Number(t?.total) || 3));
        const index = Math.max(0, Math.min(total - 1, Math.floor(Number(t?.index) || 0)));
        const steps = Array.isArray(t?.steps) ? t.steps : [];
        const results = Array.isArray(t?.results) ? t.results : [];
        const finished = results.length >= total;
        const net = results.reduce((sum, r) => sum + (r.correct ? 1 : -1) * (Number(r.value) || 0), 0);
        const tiles = Array.from({ length: total }, (_, i) => {
          const r = results[i],
            checked = !!r && typeof r.correct === "boolean";
          const current = !checked && i === index;
          const number = Number(steps[i] ?? (i === index ? state?.current?.value : 0));
          const value = Number.isFinite(number) ? number : 0;
          const points = checked ? Number(r.value) || 0 : value;
          const classes = [
            "tripletStep",
            checked ? (r.correct ? "is-correct" : "is-wrong") : current ? "is-current" : "",
            current && i === total - 1 ? "is-final" : "",
          ]
            .filter(Boolean)
            .join(" ");
          const icon = checked ? (r.correct ? "✅" : "❌") : current ? "🔥" : "○";
          const status = checked ? (r.correct ? "+" : "−") + String(Math.abs(points)) : current ? "ЗАРАЗ" : "ПОПЕРЕДУ";
          return (
            '<div class="'
            + classes
            + '"><div class="tripletStep-label">ПИТАННЯ '
            + (i + 1)
            + '</div><div class="tripletStep-value">'
            + GameUI.esc(String(value))
            + '</div><div class="tripletStep-status">'
            + icon
            + " "
            + GameUI.esc(status)
            + "</div></div>"
          );
        }).join("");
        const netLabel = (net >= 0 ? "+" : "−") + String(Math.abs(net));
        const netHTML = finished
          ? '<div class="tripletNet' + (net < 0 ? " negative" : "") + '">СЕРІЮ ЗАВЕРШЕНО • ' + netLabel + " БАЛІВ</div>"
          : "";
        return (
          '<div class="tripletStage"><div class="tripletTitle">🔥 ТРИПЛЕТ • '
          + total
          + " ВИКЛИКИ</div>"
          + '<div class="tripletSubtitle">ЕТАП '
          + (index + 1)
          + " З "
          + total
          + "</div>"
          + '<div class="tripletSteps" style="--triplet-count:'
          + total
          + '">'
          + tiles
          + "</div>"
          + '<div class="tripletPlayer"><span>ПРОХОДИТЬ ТРИПЛЕТ</span><b>'
          + GameUI.esc(name || "—")
          + "</b></div>"
          + netHTML
          + "</div>"
        );
      }

            const championFX =
              latest?.place === 1
                ? `<div class="seasonConfetti">${Array.from({ length: 46 }, (_, i) => `<i style="--x:${(i * 37) % 100}%;--h:${(i * 71) % 360};--d:${2.4 + (i % 7) * 0.22}s;--delay:${-(i % 11) * 0.23}s;--r:${i * 29}deg"></i>`).join("")}${Array.from({ length: 22 }, (_, i) => `<i class="pop" style="--x:${i % 2 ? 92 : 7}%;--h:${(i * 83) % 360};--delay:${-(i % 8) * 0.15}s;--dx:${i % 2 ? -1 : 1}${50 + (i % 6) * 18}px;--dy:-${80 + (i % 7) * 24}px"></i>`).join("")}</div><div class="seasonCannon left">🎉</div><div class="seasonCannon right">🎉</div>`
                : "";
            h += `<div class="panel center ${latest?.place === 1 ? "seasonChampionStage" : ""}">${championFX}<div style="font-size:24px;letter-spacing:.18em;font-weight:800;opacity:.8">SMOKERLOL • ${GameUI.esc(state.seasonFinal.name || "СЕЗОН")}</div>${!latest ? `<div class="huge" style="margin-top:34px">👑</div><h1 style="font-size:54px">СЕЗОННІ ПІДСУМКИ</h1><p class="muted" style="font-size:24px">${decisive ? "Grand Final • вирішальна гра сезону" : "Grand Final • подвійні сезонні очки"}</p>` : `<div style="margin-top:26px;font-size:34px;font-weight:900">${latest.place === 1 ? "👑 ЧЕМПІОН СЕЗОНУ" : latest.place + " МІСЦЕ СЕЗОНУ"}</div><div class="winner" style="font-size:clamp(52px,7vw,92px);line-height:1.05;margin:12px 0 20px">${GameUI.esc(latest.p.name)}</div><div class="huge" style="font-size:clamp(64px,8vw,110px);margin-top:4px">${decisive ? latest.p.score : latest.p.seasonPoints}</div><div class="muted" style="font-size:22px">${decisive ? "БАЛІВ У GRAND FINAL" : "СЕЗОННИХ БАЛІВ"}</div>${decisive ? "" : `<div style="font-size:22px;margin-top:12px;opacity:.8">${latest.p.wins} перемог • ${latest.p.podiums} подіумів</div>`}`}${
              revealed.length > 1
                ? `<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px">${revealed
                    .slice(0, -1)
                    .map(
                      x =>
                        `<div style="padding:10px 18px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(0,0,0,.18);font-size:19px"><b>${x.place}.</b> ${GameUI.esc(x.p.name)} — <b>${decisive ? x.p.score : x.p.seasonPoints}</b></div>`,
                    )
                    .join("")}</div>`
                : ""
            }</div>`;
          } else {
            const total = state.finalResults?.length || 0,
              shown = Math.min(state.finalRevealCount || 0, total),
              revealed = [];
            for (let n = 0; n < shown; n++) {
              const idx = total - 1 - n;
              if (idx >= 0) revealed.push({ p: state.finalResults[idx], place: idx + 1 });
            }
            const latest = revealed[revealed.length - 1];
            h += `<div class="panel center"><div style="font-size:24px;letter-spacing:.18em;font-weight:800;opacity:.8">SMOKERLOL • ФІНАЛ</div>${!latest ? `<div class="huge" style="margin-top:34px">🏆</div><h1 style="font-size:54px">ФІНАЛЬНІ РЕЗУЛЬТАТИ</h1><p class="muted" style="font-size:24px">Готуємо церемонію нагородження…</p>` : `<div style="margin-top:26px;font-size:34px;font-weight:900">${latest.place === 1 ? "🏆 ПЕРЕМОЖЕЦЬ" : latest.place + " МІСЦЕ"}</div><div class="winner" style="font-size:clamp(52px,7vw,92px);line-height:1.05;margin:12px 0 20px">${GameUI.esc(latest.p.name)}</div><div style="font-size:23px;opacity:.8">Фінальна відповідь</div><div class="answer" style="font-size:clamp(28px,3vw,44px);margin:10px auto;max-width:1000px">${GameUI.esc(latest.p.finalAnswer || "—")} ${latest.p.correct ? "✅" : "❌"}</div><div style="font-size:25px;margin-top:18px">${latest.p.beforeScore} ${latest.p.correct ? "+" : "−"} ${latest.p.bet} =</div><div class="huge" style="font-size:clamp(64px,8vw,110px);margin-top:4px">${latest.p.score}</div><div class="muted" style="font-size:22px">БАЛІВ</div>`}${
              revealed.length > 1
                ? `<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px">${revealed
                    .slice(0, -1)
                    .map(
                      x =>
                        `<div style="padding:10px 18px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(0,0,0,.18);font-size:19px"><b>${x.place}.</b> ${GameUI.esc(x.p.name)} — <b>${x.p.score}</b></div>`,
                    )
                    .join("")}</div>`
                : ""
            }</div>`;
          }
        }
        const mediaSnapshot = captureMediaPlayback();
        stopDetachedMedia(mediaSnapshot);
        app.innerHTML = h;
        QuizTheme.renderOBS(state, app);
        restoreMediaPlayback(mediaSnapshot);
        limitMediaPreview();
        syncObsMediaFromState();
        flushPendingObsMedia();
        applyAnswererHighlight();
        applyVoiceHighlight();
        fitQuestionToOBS();
        armFirstTurnClock();
        armNumericClock();
        armAudienceClock();
      }
    </script>
  </body>
</html>
